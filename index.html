<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03040a">
<meta name="robots" content="noindex">
<title>Семь планет до Солнца</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500&family=Onest:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<style>
/* =====================================================================
   «Семь планет до Солнца». Живая 3D-система: Three.js + GSAP.
   ===================================================================== */
:root {
  --bg: #03040a;
  --ink: #eef0f7;
  --muted: #8a90a6;
  --dim: #555b70;
  --sun: #ffb547;
  --sun-ink: #1a1206;
  --glass: rgba(12, 14, 26, 0.66);
  --glass-2: rgba(255, 255, 255, 0.06);
  --glass-3: rgba(255, 255, 255, 0.1);
  --edge: rgba(255, 255, 255, 0.09);
  --bad: #ff8a6b;

  --display: "Unbounded", system-ui, sans-serif;
  --text: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); overflow: hidden;
  font: 400 17px/1.55 var(--text);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body.is-flat { overflow: auto; }
img { display: block; max-width: 100%; }
h1, h2, h3, p { margin: 0; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }
::selection { background: var(--sun); color: var(--sun-ink); }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }

/* split-текст: каждая буква выезжает из-под маски */
.split .w { display: inline-block; white-space: nowrap; }
.split .c { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.16em 0 0.1em; margin: -0.16em 0 -0.1em; }
.split .c > span { display: inline-block; will-change: transform; }

/* ---------- кнопки ---------- */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 0 26px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--sun); color: var(--sun-ink); font: 500 15px/1 var(--text); letter-spacing: 0.01em;
  text-decoration: none; overflow: hidden; isolation: isolate;
  transition: transform 160ms var(--ease-out), opacity 200ms ease;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.btn::after { content: ""; position: absolute; inset: 0; z-index: -1; background: #fff; transform: translateY(101%); transition: transform 420ms var(--ease-out); }
.btn:active { transform: scale(0.97); }
.btn--glass { background: var(--glass-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--edge); }
.btn--glass::after { background: var(--glass-3); }
.btn--small { min-height: 40px; padding: 0 16px; font-size: 13px; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:disabled:active { transform: none; }
@media (hover: hover) and (pointer: fine) {
  .btn:not(:disabled):hover::after { transform: translateY(0); }
}
.link { background: none; border: 0; padding: 6px 0; cursor: pointer; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }

/* ---------- сцена ---------- */
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#gl.is-grab { cursor: grabbing; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.75) 100%); }

/* ---------- прелоадер ---------- */
.loader { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; grid-template-rows: 1fr auto; padding: 28px; clip-path: inset(0 0 0 0); }
.loader__top { display: flex; justify-content: space-between; color: var(--muted); }
.loader__num { font: 300 clamp(96px, 22vw, 320px)/0.8 var(--display); letter-spacing: -0.04em; justify-self: end; font-variant-numeric: tabular-nums; }
.loader__bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--sun); transform-origin: 0 50%; transform: scaleX(0); transition: transform 300ms ease; }

/* ---------- вход ---------- */
.gate { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px; pointer-events: none; }
.gate__in { width: min(100%, 980px); display: grid; justify-items: center; gap: 36px; text-align: center; pointer-events: auto; }
.gate h1 { font: 300 clamp(38px, 8.4vw, 124px)/0.95 var(--display); letter-spacing: -0.03em; text-transform: uppercase; }
.gate__card { width: min(100%, 440px); padding: 24px; border-radius: 24px; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: inset 0 0 0 1px var(--edge); display: grid; gap: 12px; text-align: left; }
.gate__card label { color: var(--muted); font-size: 15px; }
.gate__card .btn { width: 100%; }

/* ---------- HUD ---------- */
.hud { position: fixed; z-index: 10; pointer-events: none; opacity: 0; }
.hud > * { pointer-events: auto; }
.hud--tl { top: 24px; left: 28px; display: grid; gap: 4px; }
.hud--tl b { font: 400 15px/1.2 var(--display); letter-spacing: 0.02em; }
.hud--tl span { color: var(--muted); }
.hud--tr { top: 20px; right: 24px; display: flex; gap: 8px; align-items: center; }
.count { font: 400 13px var(--mono); color: var(--muted); padding: 0 10px; }
.count b { color: var(--ink); font-weight: 500; }
.hud--bottom { left: 50%; bottom: 24px; transform: translateX(-50%); display: grid; justify-items: center; gap: 12px; width: min(100% - 32px, 760px); }
.hint { color: var(--muted); text-align: center; }
.words { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.words span { min-width: 54px; height: 34px; padding: 0 12px; border-radius: 999px; display: grid; place-items: center; background: var(--glass-2); box-shadow: inset 0 0 0 1px var(--edge); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font: 400 14px var(--display); color: var(--dim); }
.words span.is-got { background: rgba(255, 181, 71, 0.14); box-shadow: inset 0 0 0 1px rgba(255, 181, 71, 0.45); color: var(--sun); }

/* метки планет */
.labels { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
.tag { position: absolute; left: 0; top: 0; display: flex; align-items: flex-start; background: none; border: 0; padding: 0; cursor: pointer; pointer-events: auto; color: var(--ink); text-align: left; transition: opacity 400ms ease; will-change: transform; }
.tag__line { width: 26px; height: 26px; flex: none; position: relative; }
.tag__line::before { content: ""; position: absolute; left: 0; bottom: 0; width: 36px; height: 1px; background: rgba(255, 255, 255, 0.45); transform-origin: 0 0; transform: rotate(-45deg); }
.tag__line::after { content: ""; position: absolute; left: -3px; bottom: -3px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.tag__txt { display: grid; gap: 2px; padding: 4px 10px 6px; border-radius: 10px; transform: translateY(-14px); transition: background-color 250ms ease; }
.tag__txt b { font: 400 14px/1.2 var(--display); letter-spacing: 0.02em; white-space: nowrap; }
.tag__txt span { font: 400 10.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.tag.is-done .tag__line::after { background: var(--sun); box-shadow: 0 0 0 4px rgba(255, 181, 71, 0.2); }
.tag.is-done .tag__txt span { color: var(--sun); }
.tag.is-locked { opacity: 0.5; }
.tag.is-hover .tag__txt, .tag:focus-visible .tag__txt { background: var(--glass); }
.labels.is-off .tag { opacity: 0; pointer-events: none; }
.tag.is-extra { opacity: 0.6; }
.tag.is-extra .tag__line::after { background: var(--muted); }
.tag[data-i="6"] .tag__line { display: none; }
.tag[data-i="6"] .tag__txt { transform: none; text-align: center; justify-items: center; }

/* ---------- панель планеты ---------- */
.panel {
  position: fixed; z-index: 20; top: 12px; right: 12px; bottom: 12px; width: min(580px, 46vw);
  border-radius: 28px; background: var(--glass); backdrop-filter: blur(22px) saturate(1.2); -webkit-backdrop-filter: blur(22px) saturate(1.2);
  box-shadow: inset 0 0 0 1px var(--edge); overflow: hidden;
  transform: translateX(calc(100% + 24px)); transition: transform 760ms var(--ease-drawer);
}
.panel.is-open { transform: none; }
.panel__scroll { height: 100%; overflow-y: auto; overscroll-behavior: contain; padding: 0 28px 48px; display: grid; align-content: start; }
.panel__head { display: flex; justify-content: space-between; align-items: center; gap: 12px; position: sticky; top: 0; margin: 0 -28px; padding: 22px 28px 14px; z-index: 2; background: linear-gradient(rgba(12, 14, 26, 0.92) 60%, rgba(12, 14, 26, 0)); }
.panel__idx { color: var(--muted); }
.panel { --pw: calc(min(580px, 46vw) - 56px); }
.pname { margin-top: 7vh; font: 300 min(clamp(44px, 6vw, 100px), calc(var(--pw) / var(--n, 6) * 1.12))/0.92 var(--display); letter-spacing: -0.04em; text-transform: uppercase; overflow-wrap: anywhere; }
.pmeta { margin-top: 18px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }
.pmeta span::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--sun); margin-right: 8px; vertical-align: 1px; }
.pstory { margin-top: 24px; font-size: 19px; line-height: 1.45; max-width: 40ch; }
.pstory:empty { display: none; }
.pintro { margin-top: 28px; display: grid; gap: 18px; }
.pintro:empty { display: none; }
.steps { margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { list-style: none; display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: baseline; padding: 14px 16px; border-radius: 16px; background: var(--glass-2); }
.steps li i { font: normal 400 12px var(--mono); color: var(--sun); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- этапы заданий ---------- */
.stage { margin-top: 28px; display: grid; gap: 16px; justify-items: start; min-width: 0; }
.stage:empty { display: none; }
.step { color: var(--sun); }
.task { max-width: 42ch; font-size: 17px; }
.fact { max-width: 46ch; padding: 18px 20px; border-radius: 18px; background: var(--glass-2); box-shadow: inset 0 0 0 1px var(--edge); }
.fact b { font-weight: 500; color: var(--sun); }
.field { display: grid; gap: 8px; width: 100%; }
.field label { font-size: 14px; color: var(--muted); }
.input { width: 100%; min-height: 54px; padding: 0 18px; border: 0; border-radius: 16px; background: rgba(255, 255, 255, 0.07); box-shadow: inset 0 0 0 1px var(--edge); color: var(--ink); font-size: 17px; transition: box-shadow 200ms ease, background-color 200ms ease; }
.input:focus { outline: none; box-shadow: inset 0 0 0 1px rgba(255, 181, 71, 0.6); background: rgba(255, 255, 255, 0.09); }
.input.is-bad { box-shadow: inset 0 0 0 1px rgba(255, 138, 107, 0.7); }
.msg { min-height: 1.4em; color: var(--bad); font-size: 14px; }
.note { color: var(--muted); font-size: 14px; max-width: 44ch; }
.shake { animation: shake 360ms var(--ease-out); }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

/* Венера */
.rose { width: min(100%, 440px); aspect-ratio: 1; border-radius: 24px; background: rgba(0, 0, 0, 0.35); box-shadow: inset 0 0 0 1px var(--edge); touch-action: manipulation; }
.rose .line { fill: none; stroke: var(--sun); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 3px rgba(255, 181, 71, 0.7)); }
.rose .ghost { fill: none; stroke: rgba(255, 255, 255, 0.07); stroke-width: 1; }
.rose .pt { cursor: pointer; }
.rose .pt .core { fill: var(--ink); transition: fill 200ms ease; }
.rose .pt.is-next .core, .rose .pt.is-hit .core { fill: var(--sun); }
.rose .pt.is-next .core { animation: pulse 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { transform: scale(1.5); } }
.rose .pt .hit { fill: transparent; }
.rose .pt text { fill: var(--muted); font: 500 10px var(--mono); text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.rose .pt.is-hit text { fill: var(--sun); }
.mirror { font: 300 20px/1.45 var(--display); transform: scaleX(-1); max-width: 30ch; padding: 20px; border-radius: 18px; background: var(--glass-2); }

/* Марс */
.mars-grid { position: relative; width: min(100%, 440px); display: grid; grid-template-columns: repeat(var(--c), 1fr); border-radius: 18px; overflow: hidden; background: url("photos/planets/mars.jpg") 40% 45% / 260% auto; touch-action: manipulation; }
.mars-grid::before { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.38); }
.cell { position: relative; aspect-ratio: 1; display: grid; place-items: center; }
.cell .crater { width: 64%; aspect-ratio: 1; border-radius: 50%; background: #1d140c; box-shadow: inset 0 0 0 4px #4a3220; }
.cell .flag { width: 46%; aspect-ratio: 1; background: var(--sun); clip-path: polygon(0 0, 100% 30%, 18% 60%, 18% 100%, 0 100%); }
.cell .sample { width: 30%; aspect-ratio: 1; background: var(--ink); transform: rotate(45deg); transition: opacity 200ms ease, transform 200ms var(--ease-out); }
.cell .sample.is-got { opacity: 0; transform: rotate(45deg) scale(0.4); }
.rover { position: absolute; left: 0; top: 0; width: calc(100% / var(--c)); aspect-ratio: 1; display: grid; place-items: center; z-index: 2; transition: transform 300ms var(--ease-in-out); }
.rover svg { width: 78%; height: auto; }
.rover.is-crash { animation: shake 360ms var(--ease-out); }
.pads { display: grid; grid-template-columns: repeat(4, 56px); gap: 8px; }
.pads .btn { padding: 0; font-size: 20px; border-radius: 16px; }
.program { display: flex; flex-wrap: wrap; gap: 6px; min-height: 48px; width: 100%; padding: 8px; border-radius: 16px; background: rgba(0, 0, 0, 0.3); box-shadow: inset 0 0 0 1px var(--edge); align-content: flex-start; }
.program button { width: 34px; height: 34px; border: 0; border-radius: 10px; background: var(--glass-3); color: var(--ink); cursor: pointer; font-size: 16px; }
.program .empty { color: var(--muted); font-size: 14px; padding: 6px; }
.signal { font: 300 44px/1 var(--display); color: var(--sun); font-variant-numeric: tabular-nums; }
.sunset { width: min(100%, 440px); aspect-ratio: 4 / 3; display: block; border-radius: 18px; }

/* Юпитер */
.mem { display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: 8px; width: min(100%, 460px); }
.card { aspect-ratio: 1; perspective: 700px; border: 0; padding: 0; background: none; cursor: pointer; color: inherit; }
.card__in { display: block; position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 460ms var(--ease-out); }
.card.is-open .card__in, .card.is-got .card__in { transform: rotateY(180deg); }
.card__f { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; overflow: hidden; }
.card__back { background: var(--glass-2); box-shadow: inset 0 0 0 1px var(--edge); }
.card__back::after { content: ""; width: 22%; aspect-ratio: 1; border-radius: 50%; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25), 0 0 0 7px rgba(255, 255, 255, 0.04); }
.card__front { transform: rotateY(180deg); background: #000; background-repeat: no-repeat; }
.card__front img { width: 100%; height: 100%; object-fit: cover; }
.card__front.is-name { background: var(--ink); color: var(--bg); font: 400 clamp(11px, 2.8vw, 15px)/1.1 var(--display); padding: 4px; text-align: center; overflow-wrap: anywhere; }
.card.is-got .card__front { box-shadow: inset 0 0 0 2px var(--sun); }

/* Сатурн */
.disk { width: min(100%, 400px); aspect-ratio: 1; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.disk text { font: 500 13px var(--text); text-anchor: middle; dominant-baseline: middle; }
.disk .outer text { fill: var(--ink); }
.disk .inner text { fill: var(--sun); }
.disk .inner { transition: transform 220ms var(--ease-out); }
.disk.is-drag .inner { transition: none; }
.cipher { font: 300 22px/1.5 var(--display); letter-spacing: 0.1em; color: var(--sun); word-spacing: 0.4em; }

/* Нептун */
.record { position: relative; width: min(100%, 340px); aspect-ratio: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.sector { border: 0; cursor: pointer; background: var(--c); transition: transform 160ms var(--ease-out), background-color 160ms ease, box-shadow 160ms ease; }
.sector:nth-child(1) { border-radius: 100% 0 0 0; }
.sector:nth-child(2) { border-radius: 0 100% 0 0; }
.sector:nth-child(3) { border-radius: 0 0 0 100%; }
.sector:nth-child(4) { border-radius: 0 0 100% 0; }
.sector:active { transform: scale(0.97); }
.sector.is-lit { background: #ffe9a8; box-shadow: 0 0 40px rgba(255, 210, 120, 0.7); }
.record.is-wait .sector { cursor: default; }
.record__hole { position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; border-radius: 50%; background: var(--bg); transform: translate(-50%, -50%); pointer-events: none; display: grid; place-items: center; }
.record__hole::after { content: ""; width: 22%; aspect-ratio: 1; border-radius: 50%; background: var(--sun); }

/* Солнце */
.answer-line, .pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 64px; width: 100%; padding: 10px; border-radius: 18px; }
.answer-line { background: rgba(0, 0, 0, 0.3); box-shadow: inset 0 0 0 1px var(--edge); }
.wtile { min-height: 46px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--glass-3); color: var(--ink); font: 400 17px/1 var(--display); cursor: pointer; transition: transform 160ms var(--ease-out); }
.wtile:active { transform: scale(0.96); }
.answer-line .wtile { background: var(--sun); color: var(--sun-ink); }
.letter { padding: 28px 24px; border-radius: 22px; background: var(--ink); color: #14151c; display: grid; gap: 16px; width: 100%; font-size: 18px; line-height: 1.5; }
.letter .sig { font-family: var(--display); text-align: right; }

/* ---------- открытка ---------- */
.post { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; overflow-y: auto; background: rgba(2, 3, 8, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); perspective: 1400px; }
.postcard { width: min(760px, 100%); background: var(--ink); color: #14151c; border-radius: 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; padding: 24px; box-shadow: 0 40px 120px rgba(0, 0, 0, 0.7); }
.postcard__stamp { position: relative; aspect-ratio: 4 / 5; overflow: hidden; border-radius: 18px; background: #000; }
.postcard__stamp img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.5); }
.postcard__stamp .mono { position: absolute; left: 14px; top: 12px; color: rgba(255, 255, 255, 0.85); }
.postcard__text { display: grid; align-content: space-between; gap: 18px; padding: 6px 4px; }
.postcard__text h3 { font: 400 18px/1.2 var(--display); }
.postcard__word { font: 300 clamp(44px, 7vw, 76px)/0.9 var(--display); letter-spacing: -0.03em; }
.postcard__note { color: #5d6072; font-size: 14px; margin-top: 10px; }
.postcard__after { background: #14151c; color: var(--ink); padding: 14px 16px; border-radius: 14px; }
.coupon { position: relative; min-height: 104px; border-radius: 16px; overflow: hidden; background: #e2e4ec; color: #14151c; }
.coupon__in { padding: 16px; display: grid; gap: 4px; }
.coupon__in span { font-size: 13px; color: #5d6072; }
.coupon__in b { font-weight: 500; }
.coupon canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; transition: opacity 500ms ease; }
.postcard .btn { background: #14151c; color: var(--ink); }
.postcard .btn::after { background: #2b2d38; }

/* ---------- маршрут ---------- */
.drawer { position: fixed; z-index: 30; top: 12px; left: 12px; bottom: 12px; width: min(420px, calc(100vw - 24px)); border-radius: 28px; background: var(--glass); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); box-shadow: inset 0 0 0 1px var(--edge); transform: translateX(calc(-100% - 24px)); transition: transform 640ms var(--ease-drawer); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
.drawer.is-open { transform: none; }
.drawer__head { display: flex; justify-content: space-between; align-items: center; padding: 22px 22px 8px; }
.drawer__head h2 { font: 400 22px var(--display); }
.drawer__list { overflow-y: auto; padding: 8px 12px 24px; display: grid; gap: 6px; align-content: start; }
.ditem { display: grid; grid-template-columns: 48px 1fr auto; gap: 14px; align-items: center; padding: 10px; border: 0; border-radius: 18px; background: none; color: inherit; text-align: left; cursor: pointer; transition: background-color 200ms ease; }
@media (hover: hover) and (pointer: fine) { .ditem:hover { background: var(--glass-2); } }
.ditem img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; transform: scale(1.15); }
.ditem b { font: 400 16px var(--display); display: block; }
.ditem small { color: var(--muted); font-size: 13px; }
.ditem .mono { color: var(--muted); }
.ditem.is-done .mono { color: var(--sun); }
.credits { margin: 18px 10px 0; color: var(--dim); font-size: 12px; line-height: 1.5; }

/* ---------- финальная фраза поверх сцены ---------- */
.finale { position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; padding: 24px; pointer-events: none; text-align: center; }
.finale p { font: 300 clamp(32px, 6.4vw, 96px)/1.02 var(--display); letter-spacing: -0.03em; text-transform: uppercase; max-width: 14ch; text-shadow: 0 0 32px rgba(0, 0, 0, 0.7), 0 0 4px rgba(0, 0, 0, 0.5); }

/* ---------- курсор ---------- */
.cursor { position: fixed; left: 0; top: 0; z-index: 200; pointer-events: none; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.55); transition: width 300ms var(--ease-out), height 300ms var(--ease-out), margin 300ms var(--ease-out), background-color 300ms ease; display: grid; place-items: center; mix-blend-mode: difference; }
.cursor span { font: 500 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: #fff; opacity: 0; transition: opacity 200ms ease; }
.cursor.is-big { width: 86px; height: 86px; margin: -43px 0 0 -43px; background: rgba(255, 255, 255, 0.12); }
.cursor.is-big span { opacity: 1; }
@media not all and (hover: hover) and (pointer: fine) { .cursor { display: none; } }

/* ---------- плоский режим без WebGL ---------- */
.flat { padding: 96px 16px 140px; display: grid; gap: 28px; max-width: 1100px; margin: 0 auto; }
.flat h1 { font: 300 clamp(36px, 7vw, 96px)/0.95 var(--display); text-transform: uppercase; letter-spacing: -0.03em; }
.flat__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.flat__grid button { border: 0; padding: 0 0 14px; border-radius: 22px; background: var(--glass-2); color: inherit; cursor: pointer; overflow: hidden; display: grid; gap: 10px; text-align: center; }
.flat__grid img { aspect-ratio: 1; object-fit: cover; }
.flat__grid b { font: 400 16px var(--display); }

/* ---------- телефон ---------- */
@media (max-width: 760px) {
  body { font-size: 16px; }
  .hud--tl { top: 16px; left: 16px; }
  .hud--tl b { font-size: 13px; }
  .hud--tl span { display: none; }
  .hud--tr { top: 10px; right: 10px; }
  .hud--bottom { bottom: max(16px, env(safe-area-inset-bottom)); }
  .words span { min-width: 40px; height: 30px; padding: 0 9px; font-size: 12px; }
  .tag__txt b { font-size: 12px; }
  .tag__txt span { display: none; }
  .tag[data-i="6"] .tag__txt span { display: block; }
  .tag__line { width: 16px; height: 16px; }
  .tag__line::before { width: 23px; }
  .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 56svh; border-radius: 26px; transform: translateY(calc(100% + 24px)); transition: transform 700ms var(--ease-drawer), height 600ms var(--ease-drawer); }
  .panel.is-play { height: calc(100svh - 16px); }
  .panel__scroll { padding: 0 18px 48px; }
  .panel__head { margin: 0 -18px; padding: 16px 18px 10px; }
  .panel { --pw: calc(100vw - 52px); }
  .pname { margin-top: 6px; font-size: min(clamp(38px, 12.5vw, 64px), calc(var(--pw) / var(--n, 6) * 1.12)); }
  .pstory { font-size: 17px; margin-top: 14px; }
  .postcard { grid-template-columns: 1fr; gap: 16px; padding: 16px; }
  .postcard__stamp { aspect-ratio: 16 / 9; }
  .loader { padding: 20px; }
  .gate__in { gap: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  .panel, .drawer { transition-duration: 1ms; }
  .rose .pt.is-next .core { animation: none; }
  .card__in, .rover, .disk .inner { transition: none; }
}
</style>

<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="labels" id="labels" aria-label="Планеты"></div>

<header class="hud hud--tl"><b>Семь планет до Солнца</b><span class="mono">Солнечная система · 7 остановок</span></header>
<div class="hud hud--tr">
  <span class="count" id="count"><b>0</b>/6</span>
  <button class="btn btn--glass btn--small" type="button" id="routeBtn">Маршрут</button>
</div>
<div class="hud hud--bottom" id="hudBottom">
  <p class="hint mono" id="hint">Нажми на планету · тяни, чтобы повернуть</p>
  <div class="words" id="words" aria-label="Собранные слова"></div>
</div>

<div class="finale" id="finale" hidden><p id="finaleText"></p></div>

<aside class="panel" id="panel" aria-labelledby="pName" aria-hidden="true">
  <div class="panel__scroll" id="pScroll">
    <div class="panel__head">
      <button class="btn btn--glass btn--small" type="button" id="pBack">← К системе</button>
      <span class="mono panel__idx" id="pIdx"></span>
    </div>
    <h2 class="pname" id="pName"></h2>
    <p class="mono pmeta" id="pMeta"></p>
    <p class="pstory" id="pStory"></p>
    <div class="pintro" id="pIntro"></div>
    <div class="stage" id="stage"></div>
  </div>
</aside>

<aside class="drawer" id="drawer" aria-labelledby="drawerTitle" aria-hidden="true">
  <div class="drawer__head"><h2 id="drawerTitle">Маршрут</h2><button class="btn btn--glass btn--small" type="button" id="drawerClose">Закрыть</button></div>
  <div class="drawer__list" id="drawerList"></div>
</aside>

<div class="post" id="post" role="dialog" aria-modal="true" aria-labelledby="postTitle" hidden>
  <div class="postcard" id="postcard">
    <div class="postcard__stamp"><img id="postPic" src="" alt=""><span class="mono" id="postStamp"></span></div>
    <div class="postcard__text">
      <h3 id="postTitle"></h3>
      <div><p class="postcard__word" id="postWord"></p><p class="postcard__note" id="postNote"></p></div>
      <p class="postcard__after" id="postAfter" hidden></p>
      <div class="coupon" id="coupon"></div>
      <button class="btn" type="button" id="postClose">Дальше по маршруту</button>
    </div>
  </div>
</div>

<section class="gate" id="gate" hidden aria-labelledby="gateTitle">
  <div class="gate__in">
    <h1 id="gateTitle">Семь планет до Солнца</h1>
    <form class="gate__card" id="gateForm" novalidate>
      <label for="gateIn" id="gateQ"></label>
      <input class="input" type="text" id="gateIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <p class="msg" id="gateMsg" role="status"></p>
      <button class="link" type="button" id="gateHintBtn" style="justify-self:start">Подсказка</button>
      <p class="note" id="gateHint" hidden></p>
      <button class="btn" type="submit">Взлетаем</button>
    </form>
  </div>
</section>

<div class="loader" id="loader">
  <div class="loader__top mono"><span>Загрузка системы</span><span>Для Насти</span></div>
  <div class="loader__num" id="loaderNum">0</div>
  <div class="loader__bar" id="loaderBar"></div>
</div>

<main class="flat" id="flat" hidden></main>
<div class="cursor" id="cursor" aria-hidden="true"><span>Лететь</span></div>

<script>
/* =====================================================================
   НАСТРОЙКИ — всё, что нужно поменять под себя, находится здесь.
   Ответы на вход и на записку хранятся как SHA-256, чтобы их нельзя
   было подсмотреть в коде. Хеш нового ответа: открой сайт с #dev
   в конце адреса (index.html#dev) и введи слово в генератор в «Маршруте».
   ===================================================================== */
const CONFIG = {
  herName: "Настя",

  gate: {
    question: "Как я называю тебя, когда никто не слышит?",
    hint: "Ласково и с неба",
    answerHash: "ce4935245b12ea11ad36ed4ff3e7950b40512d818c9da85fbf3d793cf304e456" // «звёздочка»
  },

  // Порядок планет = порядок слов в финальной фразе
  planets: [
    {
      key: "venus", type: "venus", name: "Венера", from: "с Венеры", nth: "Первая",
      light: "6 световых минут от Солнца", img: "venus.jpg",
      story: "Её назвали в честь богини любви. С неё и начнём.",
      steps: ["Вырасти розу Венеры из шестнадцати звёзд", "Прочитай послание, которое пришло задом наперёд"],
      mirror: "На Венере солнце встаёт на западе. А моё солнце просыпается рядом со мной. Напиши, как его зовут.",
      mirrorAnswers: ["настя", "анастасия", "настюша", "настенька", "солнце"],
      word: "ты",
      coupon: "Завтрак, который готовлю я"
    },
    {
      key: "earth", type: "earth", name: "Земля", from: "с Земли", nth: "Вторая",
      light: "8 световых минут от Солнца", img: "earth.jpg",
      story: "Единственная планета, где есть ты. Поэтому задание здесь не на экране, а у тебя дома.",
      steps: ["Разгадай, где спрятана записка", "Найди её и впиши слово"],
      notes: [
        {
          riddle: "Там, где каждое утро начинается с горячей кружки, на самой верхней полке, за самой большой из них, тебя ждёт бумажка. Слово на ней и есть ключ.",
          hint: "Кухня. Верхняя полка. Посмотри за кружками.",
          answerHash: "fff5ef4543f69e461f8f83d0b489bc4cecfecdf75c8ca6c2ffb26971e5a97fae" // «рассвет»
        }
      ],
      word: "лучшее",
      coupon: "Прогулка туда, куда скажешь"
    },
    {
      key: "mars", type: "mars", name: "Марс", from: "с Марса", nth: "Третья",
      light: "13 световых минут от Солнца", img: "mars.jpg",
      story: "Марсоходом нельзя рулить вживую: сигнал идёт слишком долго. Маршрут прокладывают заранее и отправляют целиком.",
      steps: ["Довези марсоход до флажка", "Подбери образец грунта по пути", "Пройди последний участок с двумя образцами"],
      word: "что",
      coupon: "Вечер фильмов, выбираешь ты"
    },
    {
      key: "jupiter", type: "jupiter", name: "Юпитер", from: "с Юпитера", nth: "Четвёртая",
      light: "43 световые минуты от Солнца", img: "moons.jpg",
      story: "В 1610 году Галилей увидел, что вокруг Юпитера кружат четыре луны. Их назвали в честь возлюбленных Зевса.",
      steps: ["Найди пару каждой луне Галилея", "Найди пары среди наших спутников"],
      // «Наши спутники»: шесть фото, вокруг которых вращаемся мы. Пусто — возьму снимки планет
      // Пример: { img: "photos/us1.jpg", caption: "Наш первый вечер на крыше" }
      ours: [],
      word: "со",
      coupon: "Массаж, 30 минут без телефона"
    },
    {
      key: "saturn", type: "saturn", name: "Сатурн", from: "с Сатурна", nth: "Пятая",
      light: "1 ч 19 мин света от Солнца", img: "saturn.jpg",
      story: "Кольца Сатурна шириной около 280 тысяч километров, а толщиной местами всего метров десять. Сегодня кольца шифруют.",
      steps: ["Разминка: слово со сдвигом на одну букву", "Настоящее послание с ключом Сатурна"],
      warmup: "кольца",
      secret: "обними меня крепко",
      after: "Это тоже задание. Выполнить сегодня.",
      word: "мной",
      coupon: "Поездка за город на выходных"
    },
    {
      key: "neptune", type: "neptune", name: "Нептун", from: "с Нептуна", nth: "Шестая",
      light: "4 ч 10 мин света от Солнца", img: "neptune.jpg",
      story: "«Вояджер-2» пролетел мимо Нептуна в 1989 году. На борту у него Золотая пластинка со звуками Земли.",
      steps: ["Повтори мелодию пластинки, восемь раундов", "Узнай, что ещё записано на пластинке"],
      rounds: 8,
      song: "", // ссылка на вашу песню (Яндекс Музыка, VK, YouTube). Пусто — кнопки не будет
      songTitle: "нашу песню",
      word: "случалось",
      coupon: "Плейлист, который я соберу только для тебя"
    },
    {
      key: "sun", type: "sun", name: "Солнце", nth: "Последняя",
      light: "центр системы", img: "sun.jpg",
      story: "Всё в этой системе вращается вокруг одного. Сложи шесть слов, собранных в пути.",
      steps: ["Сложи фразу из шести слов", "Прочитай письмо"],
      letter: [
        "Это путешествие я собирал для тебя по кусочку.",
        "Каждая планета здесь про то, как мне с тобой хорошо: по утрам, в дороге, за глупыми играми и под нашу музыку.",
        "Ты моё Солнце. Всё моё вращается вокруг тебя, и мне так нравится."
      ],
      signature: "Твой",
      coupon: "Последний подарок ждёт тебя в реальности: спроси меня о нём сегодня вечером"
    }
  ]
};

/* ===================================================================== */

const P = CONFIG.planets;
// Остальные тела системы: заданий нет, можно подлететь и посмотреть
const EXTRA = {
  7: { name: "Меркурий", nth: "Без задания", light: "3 световые минуты от Солнца", story: "Ближе всех к Солнцу. Год здесь длится 88 земных дней, а днём поверхность нагревается больше чем до 400 градусов. Слишком жарко для заданий, так что просто полюбуйся." },
  8: { name: "Уран", nth: "Без задания", light: "2 ч 40 мин света от Солнца", story: "Уран вращается лёжа на боку: его ось наклонена почти на 98 градусов. Поэтому на каждом полюсе по 42 года длится день, а потом 42 года ночь." },
  9: { name: "Плутон", nth: "Карликовая планета", light: "5 ч 30 мин света от Солнца", story: "С 2006 года Плутон считается карликовой планетой, поэтому его нет в маршруте. Но на нём есть огромное светлое сердце: равнина Томбо, которую в 2015 году сфотографировал аппарат New Horizons." }
};
const BODY = i => P[i] || EXTRA[i];
const LABELS = [7, 0, 1, 2, 3, 4, 8, 5, 9, 6]; // все подписи на сцене
const PIC = f => `photos/planets/${f}`;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DEV = location.hash === "#dev";
const G = window.gsap || null;
const wait = ms => new Promise(r => setTimeout(r, REDUCED ? Math.min(ms, 300) : ms));
const num = n => String(n + 1).padStart(2, "0"); // номер планеты: 01…06

/* ---------- хеши ---------- */
const norm = s => String(s).toLowerCase().replace(/ё/g, "е").replace(/[^a-zа-я0-9]/g, "");
async function sha(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(norm(s)));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

/* ---------- прогресс ---------- */
const KEY = "nebo-progress-v2";
let state = { gate: false, done: [], scratched: [] };
try { const raw = localStorage.getItem(KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const isDone = i => state.done.includes(i);
const doneCount = () => [0, 1, 2, 3, 4, 5].filter(isDone).length;
const shake = n => { n.classList.remove("shake"); void n.offsetWidth; n.classList.add("shake"); };
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }

/* ---------- split-текст ---------- */
function split(node, text) {
  node.classList.add("split");
  node.setAttribute("aria-label", text);
  node.innerHTML = text.split(" ").map(w => `<span class="w" aria-hidden="true">${[...w].map(c => `<span class="c"><span>${esc(c)}</span></span>`).join("")}</span>`).join(" ");
  return node.querySelectorAll(".c > span");
}
function reveal(node, text, delay = 0) {
  const chars = split(node, text);
  if (G && !REDUCED) G.fromTo(chars, { yPercent: 115 }, { yPercent: 0, duration: 1.1, ease: "expo.out", stagger: 0.028, delay });
}

/* =====================================================================
   3D: модуль внизу страницы вызывает APP.progress и APP.ready.
   Если WebGL или библиотеки не загрузились, работает плоский режим.
   ===================================================================== */
const APP = window.APP = { gl: null, live: false, focused: -1, playing: -1 };
let booted = false;

APP.progress = p => {
  $("#loaderNum").textContent = Math.round(p * 100);
  $("#loaderBar").style.transform = `scaleX(${p})`;
};
APP.ready = api => { APP.gl = api; boot(); };
APP.pick = i => { if (APP.live) openPlanet(i); };
APP.hover = i => {
  if (!APP.live) i = -1;
  document.querySelectorAll(".tag").forEach(t => t.classList.toggle("is-hover", +t.dataset.i === i));
  $("#cursor").classList.toggle("is-big", i >= 0);
  $("#gl").style.cursor = i >= 0 ? "pointer" : "";
  APP.gl?.setHover(i);
};

function boot() {
  if (booted) return; booted = true;
  const out = () => {
    $("#loader").remove();
    if (state.gate || DEV) enter(false); else showGate();
  };
  APP.progress(1);
  if (G && !REDUCED) {
    G.timeline({ onComplete: out })
      .to("#loaderNum", { yPercent: -30, opacity: 0, duration: 0.6, ease: "power3.in", delay: 0.3 })
      .to("#loader", { clipPath: "inset(0% 0% 100% 0%)", duration: 1, ease: "expo.inOut" }, "-=0.1");
  } else out();
}
function bootFlat() {
  if (booted) return; booted = true;
  document.body.classList.add("is-flat");
  ["#gl", ".vignette", "#labels"].forEach(s => $(s).hidden = true);
  $("#loader").remove();
  if (state.gate || DEV) enter(false); else showGate();
}
// если WebGL нет или 3D не ответило за 15 секунд — плоский режим
(() => {
  let ok = false;
  try { const c = document.createElement("canvas"); ok = !!(window.WebGLRenderingContext && (c.getContext("webgl2") || c.getContext("webgl"))); } catch (e) {}
  if (!ok || !G) { setTimeout(bootFlat, 50); return; }
  setTimeout(() => { if (!APP.gl) bootFlat(); }, 15000);
})();

/* ---------- вход ---------- */
function showGate() {
  $("#gate").hidden = false;
  $("#gateQ").textContent = CONFIG.gate.question;
  $("#gateHint").textContent = CONFIG.gate.hint;
  reveal($("#gateTitle"), "Семь планет до Солнца", 0.1);
  if (G && !REDUCED) G.from(".gate__card", { y: 40, opacity: 0, duration: 1.2, ease: "expo.out", delay: 0.7 });
  $("#gateHintBtn").onclick = () => { $("#gateHint").hidden = false; $("#gateHintBtn").hidden = true; };
  $("#gateIn").oninput = () => { $("#gateIn").classList.remove("is-bad"); $("#gateMsg").textContent = ""; };
  $("#gateForm").onsubmit = async e => {
    e.preventDefault();
    const inp = $("#gateIn");
    if (await sha(inp.value) === CONFIG.gate.answerHash) {
      state.gate = true; save(); inp.blur();
      const go = () => { $("#gate").hidden = true; enter(true); };
      if (G && !REDUCED) G.to("#gate", { opacity: 0, filter: "blur(12px)", scale: 1.04, duration: 0.9, ease: "power3.in", onComplete: go });
      else go();
    } else {
      inp.classList.add("is-bad"); $("#gateMsg").textContent = "Не то слово. Попробуй ещё раз."; shake($("#gateForm"));
    }
  };
}

/* ---------- главный экран ---------- */
function enter(intro) {
  APP.live = true;
  buildLabels();
  refresh();
  if (APP.gl) {
    APP.gl.intro(intro);
    if (G && !REDUCED) {
      G.to(".hud", { opacity: 1, duration: 1.2, ease: "power2.out", stagger: 0.12, delay: intro ? 3 : 0.5 });
      G.fromTo(".tag", { opacity: 0 }, { opacity: 1, duration: 1, stagger: 0.08, delay: intro ? 3.4 : 0.8, clearProps: "opacity" });
    } else document.querySelectorAll(".hud").forEach(h => h.style.opacity = 1);
  } else {
    document.querySelectorAll(".hud").forEach(h => h.style.opacity = 1);
    $("#hint").hidden = true;
    renderFlat();
  }
  bindCursor();
}
function refresh() {
  const n = doneCount();
  $("#count").innerHTML = `<b>${n}</b>/6`;
  $("#words").innerHTML = P.slice(0, 6).map((p, i) => `<span class="${isDone(i) ? "is-got" : ""}">${isDone(i) ? esc(p.word) : "·"}</span>`).join("");
  document.querySelectorAll(".tag").forEach(t => {
    const i = +t.dataset.i, sun = i === 6;
    t.classList.toggle("is-done", isDone(i));
    t.classList.toggle("is-locked", sun && n < 6 && !DEV);

/* купон под слоем, который стирается пальцем */
function scratch(box, text, i) {
  box.innerHTML = `<div class="coupon__in"><span>Купон, действует бессрочно</span><b>${esc(text)}</b></div>`;
  if (state.scratched.includes(i)) return;
  const cv = document.createElement("canvas");
  cv.setAttribute("aria-label", "Защитный слой: сотри пальцем или нажми Enter, чтобы открыть купон");
  cv.setAttribute("role", "img");
  cv.tabIndex = 0;
  box.appendChild(cv);
  requestAnimationFrame(() => {
    const r = box.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
    cv.width = r.width * d; cv.height = r.height * d;
    const cx = cv.getContext("2d"); cx.scale(d, d);
    cx.fillStyle = "#c9a24a"; cx.fillRect(0, 0, r.width, r.height);
    for (let k = 0; k < 220; k++) { cx.fillStyle = `rgba(255,240,200,${Math.random() * 0.55})`; cx.fillRect(Math.random() * r.width, Math.random() * r.height, 1.5, 1.5); }
    cx.fillStyle = "#3d2c0f"; cx.textAlign = "center"; cx.font = "500 15px Onest, system-ui, sans-serif";
    cx.fillText("Сотри пальцем", r.width / 2, r.height / 2 + 5);
    cx.globalCompositeOperation = "destination-out";
    let down = false, last = null, n = 0, gone = false;
    const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    const open = () => {
      if (gone) return; gone = true; cv.style.opacity = 0; setTimeout(() => cv.remove(), 500);
      if (!state.scratched.includes(i)) { state.scratched.push(i); save(); }
    };
    const check = () => {
      const data = cx.getImageData(0, 0, cv.width, cv.height).data;
      let clear = 0, tot = 0;
      for (let k = 3; k < data.length; k += 64) { tot++; if (data[k] < 40) clear++; }
      if (clear / tot > 0.5) open();
    };
    const draw = q => {
      cx.lineWidth = 44; cx.lineCap = "round"; cx.beginPath(); cx.moveTo(...(last || q)); cx.lineTo(...q); cx.stroke();
      cx.beginPath(); cx.arc(q[0], q[1], 22, 0, 6.283); cx.fill(); last = q;
      if (++n % 8 === 0) check();
    };
    cv.addEventListener("pointerdown", e => { down = true; last = null; cv.setPointerCapture(e.pointerId); draw(pt(e)); });
    cv.addEventListener("pointermove", e => { if (down) draw(pt(e)); });
    const up = () => { down = false; last = null; };
    cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
    cv.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
}

function answerField(stage, { label, hints = [], check, okText = "Проверить", onOk }) {
  const box = document.createElement("div");

  stage.appendChild(box);
  const inp = $("input", box), msg = $(".msg", box), hint = $(".note", box), [go, hb] = box.querySelectorAll(".row button");
  let shown = 0, fails = 0;
  const showHint = () => { if (shown < hints.length) { hint.hidden = false; hint.textContent = hints.slice(0, ++shown).join(" "); } if (shown >= hints.length && hb) hb.hidden = true; };
  const run = async () => {
    if (!inp.value.trim()) { inp.focus(); return; }
    if (await check(inp.value)) { inp.disabled = true; go.disabled = true; msg.textContent = ""; onOk(); return; }
    fails++; inp.classList.add("is-bad"); shake(box);
    msg.textContent = fails >= 2 && shown < hints.length ? "Держи подсказку." : "Не то. Попробуй ещё раз.";
    if (fails >= 2) showHint();
  };
  go.onclick = run;
  if (hb) hb.onclick = showHint;
  inp.onkeydown = e => { if (e.key === "Enter") run(); };
  inp.oninput = () => { inp.classList.remove("is-bad"); msg.textContent = ""; };
  return box;
}

/* ---------- 1. Венера: роза Венеры и послание наоборот ---------- */
function gVenus(p, stage, done) {
  // Венера относительно Земли за 8 лет: пятилепестковая «роза»
  const T = 2922, S = 1200, N = 16, R = 74, C = 150;
  const pos = t => { const a = 2 * Math.PI * t / 224.701, b = 2 * Math.PI * t / 365.256; return [C + R * (0.7233 * Math.cos(a) - Math.cos(b)), C + R * (0.7233 * Math.sin(a) - Math.sin(b))]; };
  const curve = Array.from({ length: S + 1 }, (_, k) => pos(k * T / S));
  const idx = Array.from({ length: N }, (_, k) => Math.round(k * S / N));
  const d = (a, b) => "M" + curve.slice(a, b + 1).map(q => q.map(v => v.toFixed(1)).join(",")).join("L");
  stage.innerHTML = `
    <p class="mono step">Этап 01 / 02</p>
    <p class="task">Если восемь лет отмечать, где Венера на нашем небе, получится цветок. Нажимай на звёзды по порядку, от 1 до ${N}, и он вырастет.</p>
    <svg class="rose" viewBox="0 0 300 300" role="group" aria-label="Звёзды для розы Венеры">
      <path class="ghost" d="${d(0, S)}"/><path class="line" id="roseLine" d=""/>
      ${idx.map((ci, k) => {
        const [x, y] = curve[ci], dx = x - C, dy = y - C, l = Math.hypot(dx, dy) || 1;
        return `<g class="pt ${k === 0 ? "is-next" : ""}" data-k="${k}" tabindex="0" role="button" aria-label="Звезда ${k + 1}">
          <circle class="hit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="16"/><circle class="core" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5"/>
          <text x="${(x + dx / l * 13).toFixed(1)}" y="${(y + dy / l * 13).toFixed(1)}">${k + 1}</text></g>`;
      }).join("")}
    </svg><p class="msg" role="status"></p>`;
  const line = $("#roseLine", stage), msg = $(".msg", stage);
  let nextK = 0, drawn = 0;
  const grow = to => {
    line.setAttribute("d", d(0, to));
    const L = line.getTotalLength(), from = drawn; drawn = L;
    if (!REDUCED) line.animate([{ strokeDasharray: L, strokeDashoffset: L - from }, { strokeDasharray: L, strokeDashoffset: 0 }], { duration: 620, easing: "cubic-bezier(0.23, 1, 0.32, 1)" });
  };
  const tap = g => {
    const k = +g.dataset.k;
    if (k !== nextK) { msg.textContent = `Сейчас нужна звезда ${nextK + 1}.`; shake($(".rose", stage)); return; }
    msg.textContent = ""; g.classList.remove("is-next"); g.classList.add("is-hit"); nextK++;
    grow(nextK === N ? S : idx[nextK - 1]);
    if (nextK < N) stage.querySelector(`.pt[data-k="${nextK}"]`).classList.add("is-next");
    else later(() => {
      stage.appendChild(el(`<p class="fact">Это <b>роза Венеры</b>: за восемь земных лет Венера пять раз подходит к нам ближе всего и каждый раз рисует на небе лепесток. Цветы с другой планеты, для тебя.</p>`));
      next(stage, "Послание с Венеры", mirrorStep);
    }, 700);
  };
  stage.querySelectorAll(".pt").forEach(g => {
    g.addEventListener("click", () => tap(g));
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tap(g); } });
  });
  function mirrorStep() {
    stage.innerHTML = `
      <p class="mono step">Этап 02 / 02</p>
      <p class="task">Венера вращается в обратную сторону, поэтому сутки там длиннее года. Даже послание оттуда пришло задом наперёд.</p>
      <p class="mirror" id="mirror">${esc(p.mirror)}</p>`;
    answerField(stage, {
      label: "Ответ на послание",
      hints: ["Попробуй поднести экран к зеркалу.", "Ответ — одно имя. Чьё солнце просыпается рядом со мной?"],
      check: v => p.mirrorAnswers.some(a => norm(a) === norm(v)),
      onOk: () => later(done, 400)
    });
    const flip = el(`<button class="link" type="button">Развернуть послание</button>`);
    flip.onclick = () => { $("#mirror").style.transform = "none"; flip.remove(); };
    later(() => stage.appendChild(flip), 60000);
  }
}

const MARS = [

];
const DIRS = { "↑": [-1, 0], "→": [0, 1], "↓": [1, 0], "←": [0, -1] };
const ROVER = `<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="8" y="10" width="24" height="16" rx="3" fill="#eef0f7"/><rect x="17" y="4" width="6" height="7" fill="#eef0f7"/><circle cx="20" cy="5" r="3" fill="#ffb547"/><circle cx="11" cy="31" r="5" fill="#14151c" stroke="#eef0f7" stroke-width="2"/><circle cx="29" cy="31" r="5" fill="#14151c" stroke="#eef0f7" stroke-width="2"/></svg>`;
let marsWarm = false;
function gMars(p, stage, done) {
  const level = L => {
    const lv = MARS[L], R = lv.map.length, Cc = lv.map[0].length;
    let start, samples = [];
    lv.map.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === "S") start = [y, x]; if (ch === "*") samples.push(y + "," + x); }));
    stage.innerHTML = `
      <p class="mono step">Участок ${num(L)} / 03</p>
      <p class="task">${lv.text} Сначала собери программу стрелками, потом отправь её целиком.</p>
      <div class="mars-grid" style="--c:${Cc}" aria-label="Карта участка">
        ${lv.map.map((row, y) => [...row].map((ch, x) => `<div class="cell" data-c="${y},${x}">${ch === "X" ? '<span class="crater"></span>' : ch === "T" ? '<span class="flag"></span>' : ch === "*" ? '<span class="sample"></span>' : ""}</div>`).join("")).join("")}
        <div class="rover" id="rover">${ROVER}</div>
      </div>
      <div class="program" id="prog" aria-live="polite"></div>
      <div class="pads">${Object.keys(DIRS).map(k => `<button class="btn btn--glass" type="button" data-d="${k}" aria-label="${{ "↑": "Вверх", "→": "Вправо", "↓": "Вниз", "←": "Влево" }[k]}">${k}</button>`).join("")}</div>
      <div class="row"><button class="btn" type="button" id="send">Отправить на Марс</button><button class="btn btn--glass" type="button" id="clear">Стереть</button></div>
      <p class="msg" role="status" id="mmsg"></p>`;
    const rover = $("#rover", stage), prog = $("#prog", stage), msg = $("#mmsg", stage), send = $("#send", stage);
    let cmds = [], busy = false;
    const place = ([y, x]) => { rover.style.transform = `translate(${x * 100}%, ${y * 100}%)`; };
    const drawProg = () => { prog.innerHTML = cmds.length ? cmds.map((c, k) => `<button type="button" data-k="${k}" aria-label="Убрать шаг ${k + 1}">${c}</button>`).join("") : `<span class="empty">Программа пуста. Шагов можно до ${lv.max}.</span>`; };
    const reset = () => { place(start); stage.querySelectorAll(".sample").forEach(s => s.classList.remove("is-got")); };
    reset(); drawProg();
    stage.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
      if (busy) return;
      if (cmds.length >= lv.max) { msg.textContent = `Больше ${lv.max} шагов марсоход не запомнит.`; return; }
      msg.textContent = ""; cmds.push(b.dataset.d); drawProg();
    });
    prog.onclick = e => { const b = e.target.closest("[data-k]"); if (!b || busy) return; cmds.splice(+b.dataset.k, 1); drawProg(); };
    $("#clear", stage).onclick = () => { if (!busy) { cmds = []; drawProg(); msg.textContent = ""; } };
    send.onclick = async () => {
      if (busy || !cmds.length) return;
      busy = true; send.disabled = true; reset();
      const delay = marsWarm ? 3 : 13;
      const sig = el(`<p class="task">${marsWarm ? "Связь уже прогрета." : "В жизни сигнал до Марса идёт от 3 до 22 минут. У нас 13 секунд."} <span class="signal" id="sig">${delay}</span></p>`);
      stage.insertBefore(sig, prog);
      for (let s = delay; s > 0; s--) { $("#sig", stage).textContent = s; await wait(1000); if (APP.playing !== 2) return; }
      sig.remove(); marsWarm = true;
      let at = [...start], got = new Set(), fail = "";
      for (const c of cmds) {
        const [dy, dx] = DIRS[c], ny = at[0] + dy, nx = at[1] + dx;
        if (ny < 0 || nx < 0 || ny >= R || nx >= Cc) { fail = "Марсоход упёрся в край карты."; break; }
        at = [ny, nx]; place(at);
        await wait(340); if (APP.playing !== 2) return;
        const ch = lv.map[ny][nx];
        if (ch === "X") { fail = "Марсоход съехал в кратер."; break; }
        if (ch === "*") { got.add(ny + "," + nx); stage.querySelector(`[data-c="${ny},${nx}"] .sample`).classList.add("is-got"); }
      }
      const ok = !fail && lv.map[at[0]][at[1]] === "T" && got.size === samples.length;
      if (!fail && !ok) fail = lv.map[at[0]][at[1]] === "T" ? "Доехал, но собрал не все образцы." : "Программа кончилась, а флажок ещё впереди.";
      if (!ok) {
        rover.classList.remove("is-crash"); void rover.offsetWidth; rover.classList.add("is-crash");
        msg.textContent = fail + " Поправь программу и отправь снова.";
        busy = false; send.disabled = false; return;
      }
      msg.textContent = "";
      stage.querySelectorAll(".pads, #send, #clear").forEach(n => n.hidden = true);
      if (L + 1 < MARS.length) next(stage, `Участок ${L + 2}`, () => level(L + 1));
      else {
        stage.innerHTML = `
          <svg class="sunset" viewBox="0 0 400 300" role="img" aria-label="Закат на Марсе">
            <rect width="400" height="300" fill="#8a6a4c"/><rect width="400" height="150" fill="#a9876a"/><rect y="150" width="400" height="60" fill="#b8977a"/>
            <circle cx="200" cy="196" r="70" fill="#7f9fbf"/><circle cx="200" cy="196" r="44" fill="#a9c2da"/><circle cx="200" cy="196" r="14" fill="#eef4f8"/>
            <path d="M0 210 L90 186 L170 204 L260 180 L340 200 L400 188 L400 300 L0 300 Z" fill="#4a3424"/>
          </svg>
          <p class="fact">Марсоход на месте. А вот что он видит вечером: <b>на Марсе закаты голубые</b>. Пыль в воздухе рассеивает свет наоборот, не так, как у нас.</p>`;
        next(stage, "Забрать открытку", done);
      }
    };
  };
  level(0);
}

function moonCrop(m) {
  const k = 0.84 / (2 * m.r), w = 1400 * k, h = 1113 * k, ox = 0.5 - m.cx * k, oy = 0.5 - m.cy * k;
  return `background-image:url(${PIC("moons.jpg")});background-size:${(w * 100).toFixed(1)}% auto;background-position:${(ox / (1 - w) * 100).toFixed(2)}% ${(oy / (1 - h) * 100).toFixed(2)}%`;
}
function memory(stage, cards, cols, onWin, onPair) {
  const deck = cards.map((c, k) => ({ ...c, k })).sort(() => Math.random() - 0.5);
  const grid = el(`<div class="mem" style="--cols:${cols}"></div>`);
  const moves = el(`<p class="note">Ходов: 0</p>`);
  stage.append(grid, moves);
  let open = [], got = 0, n = 0, busy = false;
  deck.forEach((c, k) => {
    const b = el(`<button class="card" type="button" aria-label="Карточка ${k + 1}"><span class="card__in"><span class="card__f card__back"></span><span class="card__f card__front ${c.name ? "is-name" : ""}" style="${c.style || ""}">${c.img ? `<img src="${esc(c.img)}" alt="">` : c.name ? esc(c.name) : ""}</span></span></button>`);
    b.onclick = () => {
      if (busy || b.classList.contains("is-open") || b.classList.contains("is-got")) return;
      b.classList.add("is-open"); open.push([b, c]);
      if (open.length < 2) return;
      moves.textContent = "Ходов: " + ++n;
      const [[b1, c1], [b2, c2]] = open; open = [];
      if (c1.pair === c2.pair) {

        b1.setAttribute("aria-label", "Найдено"); b2.setAttribute("aria-label", "Найдено");
        onPair?.(c1.pair);
        if (++got === cards.length / 2) later(onWin, 700);
      } else {
        busy = true;
        later(() => { b1.classList.remove("is-open"); b2.classList.remove("is-open"); busy = false; }, 900);
      }
    };
    grid.appendChild(b);
  });
  if (G && !REDUCED) G.from(grid.children, { scale: 0.85, opacity: 0, duration: 0.7, ease: "expo.out", stagger: 0.035 });
}

/* ---------- 5. Сатурн: шифровальные кольца ---------- */
const AB = "АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";
const encode = (s, k) => [...s.toUpperCase().replace(/Ё/g, "Е")].map(ch => { const i = AB.indexOf(ch); return i < 0 ? ch : AB[(i + k) % 32]; }).join("");
function gSaturn(p, stage, done) {
  const round = (shift, plain, n, intro, hints, after) => {

        <g class="outer">${[...AB].map((ch, k) => { const a = k / 32 * 2 * Math.PI; return `<text x="${(160 + 137 * Math.sin(a)).toFixed(1)}" y="${(160 - 137 * Math.cos(a)).toFixed(1)}">${ch}</text>`; }).join("")}</g>
        <g class="inner" style="transform-origin:160px 160px">${[...AB].map((ch, k) => { const a = k / 32 * 2 * Math.PI, x = (160 + 99 * Math.sin(a)).toFixed(1), y = (160 - 99 * Math.cos(a)).toFixed(1); return `<text x="${x}" y="${y}" transform="rotate(${(k / 32 * 360).toFixed(2)} ${x} ${y})">${ch}</text>`; }).join("")}</g>
        <text x="160" y="160" fill="#8a90a6" style="font-size:11px">тяни кольцо</text>
      </svg>
      <div class="row"><button class="btn btn--glass btn--small" type="button" id="rl">← Повернуть</button><button class="btn btn--glass btn--small" type="button" id="rr">Повернуть →</button></div>
      <p class="note" id="pair">Сейчас под А стоит А</p>`;
    const disk = $(".disk", stage), inner = $(".inner", stage), pair = $("#pair", stage);
    let rot = 0; // на сколько букв повернули внутреннее кольцо
    const setRot = r => {
      rot = ((Math.round(r) % 32) + 32) % 32;
      inner.style.transform = `rotate(${-rot * 360 / 32}deg)`;

      pair.textContent = `Сейчас под А стоит ${AB[rot]}`;

    let drag = null;
    const ang = e => { const b = disk.getBoundingClientRect(); return Math.atan2(e.clientX - b.left - b.width / 2, -(e.clientY - b.top - b.height / 2)); };
    disk.addEventListener("pointerdown", e => { drag = { a: ang(e), r: rot }; disk.setPointerCapture(e.pointerId); disk.classList.add("is-drag"); });
    disk.addEventListener("pointermove", e => {
      if (!drag) return;

      setRot(drag.r - da / (2 * Math.PI) * 32);

    disk.addEventListener("pointerup", end); disk.addEventListener("pointercancel", end);

      () => later(done, 400)), 500));
}

/* ---------- 6. Нептун: Золотая пластинка ---------- */
let AC = null;
function tone(freq, dur = 0.42, type = "sine", vol = 0.22) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
function gNeptune(p, stage, done) {
  const PADS = [{ c: "#c8962e", f: 523.25 }, { c: "#e0b04a", f: 659.25 }, { c: "#b07f22", f: 783.99 }, { c: "#d4a23c", f: 880 }];
  stage.innerHTML = `
    <p class="mono step">Включи звук</p>
    <p class="task">Пластинка сыграет короткую мелодию. Повтори её, нажимая на те же части. С каждым раундом она длиннее, всего раундов ${p.rounds}.</p>
    <div class="record is-wait" id="rec">${PADS.map((q, k) => `<button class="sector" type="button" style="--c:${q.c}" data-k="${k}" aria-label="Часть пластинки ${k + 1}"></button>`).join("")}<span class="record__hole"></span></div>
    <p class="note" id="round">Раунд 0 из ${p.rounds}</p>
    <button class="btn" type="button" id="mStart">Поставить пластинку</button>`;
  const rec = $("#rec", stage), pads = [...rec.querySelectorAll(".sector")], roundEl = $("#round", stage);
  const seq = Array.from({ length: p.rounds }, () => Math.floor(Math.random() * 4));
  let round = 0, step = 0;
  const flash = (k, ms = 380) => { pads[k].classList.add("is-lit"); tone(PADS[k].f); later(() => pads[k].classList.remove("is-lit"), ms); };
  const play = () => {
    rec.classList.add("is-wait"); step = 0;
    roundEl.textContent = `Раунд ${round + 1} из ${p.rounds}. Слушай.`;
    const gap = Math.max(420, 640 - round * 25);
    seq.slice(0, round + 1).forEach((k, n) => later(() => flash(k), 600 + n * gap));
    later(() => { rec.classList.remove("is-wait"); roundEl.textContent = `Раунд ${round + 1} из ${p.rounds}. Повторяй.`; }, 600 + (round + 1) * gap);
  };
  $("#mStart", stage).onclick = e => { e.currentTarget.hidden = true; play(); };
  pads.forEach((pad, k) => pad.addEventListener("click", () => {
    if (rec.classList.contains("is-wait")) return;
    flash(k, 220);
    if (k !== seq[step]) {
      rec.classList.add("is-wait"); tone(160, 0.5, "triangle", 0.18); shake(rec);
      roundEl.textContent = "Мимо. Слушай ещё раз.";
      later(play, 1300); return;
    }
    if (++step > round) {
      round++;
      if (round === p.rounds) {
        rec.classList.add("is-wait");
        [0, 1, 3, 2, 0].forEach((q, n) => later(() => flash(q, 300), 300 + n * 150));
        later(finish, 1400); return;
      }
      later(play, 800);
    }
  }));
  function finish() {
    stage.innerHTML = `
      <p class="fact">На Золотой пластинке «Вояджеров» есть музыка, шум дождя, смех и <b>поцелуй</b>. А ещё сигналы мозга Энн Друян: перед записью она думала о том, каково это, влюбиться. Через пару дней после того, как они с Карлом Саганом признались друг другу. Эта запись сейчас летит за пределами Солнечной системы.</p>
      <p class="task">Если когда-нибудь нашу запись тоже отправят к звёздам, пусть там будет ${esc(p.songTitle)}.</p>
      <div class="row">${p.song ? `<a class="btn btn--glass" href="${esc(p.song)}" target="_blank" rel="noopener">Включить ${esc(p.songTitle)}</a>` : ""}<button class="btn" type="button" id="toPost">Забрать открытку</button></div>`;
    $("#toPost", stage).onclick = done;
    if (G && !REDUCED) G.from(stage.children, { y: 24, opacity: 0, duration: 0.9, ease: "expo.out", stagger: 0.08 });
  }
}

/* ---------- 7. Солнце: фраза и письмо ---------- */
function gSun(p, stage) {
  const words = P.slice(0, 6).map(x => x.word);
  const pool = words.map((w, k) => ({ w, k })).sort(() => Math.random() - 0.5);
  const picked = [];
  stage.innerHTML = `
    <p class="task">Нажимай на слова в правильном порядке. Ошиблась — нажми на слово в строке, и оно вернётся.</p>
    <div class="answer-line" id="ans" aria-live="polite"></div><div class="pool" id="pool"></div>`;
  const ans = $("#ans", stage), poolEl = $("#pool", stage);
  const render = () => {
    ans.innerHTML = ""; poolEl.innerHTML = "";
    picked.forEach((q, n) => { const b = el(`<button class="wtile" type="button">${esc(q.w)}</button>`); b.onclick = () => { picked.splice(n, 1); render(); }; ans.appendChild(b); });
    pool.filter(q => !picked.includes(q)).forEach(q => { const b = el(`<button class="wtile" type="button">${esc(q.w)}</button>`); b.onclick = () => { picked.push(q); render(); check(); }; poolEl.appendChild(b); });
  };
  const check = () => {
    if (picked.length < words.length) return;
    if (picked.every((q, n) => q.k === n)) later(finale, 300);
    else { shake(ans); later(() => { picked.length = 0; render(); }, 700); }
  };
  render();

  async function finale() {
    if (!isDone(6)) { state.done.push(6); save(); }
    const panel = $("#panel");
    panel.classList.remove("is-open");
    APP.gl?.finale();
    const f = $("#finale"), text = $("#finaleText");
    f.hidden = false; f.style.cssText = "";

      const chars = split(text, words.join(" "));
      G.fromTo(chars, { yPercent: 115 }, { yPercent: 0, duration: 1.4, ease: "expo.out", stagger: 0.05, delay: 1.8 });
      await wait(7600);
      await new Promise(r => G.to(f, { opacity: 0, filter: "blur(10px)", duration: 1.2, onComplete: r }));
    } else { text.textContent = words.join(" "); await wait(3500); }
    f.hidden = true;
    $("#pName").textContent = "Письмо";

    panel.classList.add("is-open", "is-play");
    await wait(900);
    const box = $("#letter", stage);
    for (const [t, sig] of [...p.letter.map(t => [t, false]), [p.signature, true]]) {
      const para = document.createElement("p"); if (sig) para.className = "sig"; box.appendChild(para);
      if (REDUCED) { para.textContent = t; continue; }
      for (let k = 1; k <= t.length; k++) { para.textContent = t.slice(0, k); await new Promise(r => setTimeout(r, ".,".includes(t[k - 1]) ? 180 : 30)); if (APP.playing !== 6) return; }
      await wait(400);
    }
    const c = el(`<div class="coupon" style="width:100%"></div>`);
    stage.appendChild(c);
    scratch(c, p.coupon, 6);
    if (G && !REDUCED) G.from(c, { y: 24, opacity: 0, duration: 0.9, ease: "expo.out" });
  }
}

/* ---------- планеты (размеры и расстояния условные, чтобы всё было видно) ---------- */

  { id: 2, tex: "2k_mars.jpg", r: 0.78, d: 20.5, sp: 0.095, a0: 4.1, rot: 0.33, view: 1 },

// положение на орбите; у Плутона орбита наклонена

DEF.forEach(d => {

const homeDist = () => MOBILE() ? 102 : 110;

const cam = { mode: "rig", from: new THREE.Vector3(), to: new THREE.Vector3(), lookFrom: new THREE.Vector3(), lookTo: new THREE.Vector3(), t: 1 };

const radiusOf = i => i === 6 ? SUN_R : byId(i).r;

function focusView(i) {
  const P0 = worldOf(i), r = radiusOf(i);

const api = {
  intro(full) {
    if (full && G && !REDUCED) {
      camera.position.set(0, 420, 900); look.set(0, 0, 0);
      cam.mode = "fly"; cam.from.copy(camera.position); cam.lookFrom.set(0, 0, 0); rigPos(cam.to); cam.lookTo.set(0, 0, 0); cam.t = 0;

/* ---------- метки над планетами ---------- */
const v3 = new THREE.Vector3(), one = new THREE.Vector3();
function placeLabels() {
  const tags = document.querySelectorAll(".tag");
  if (!tags.length) return;
  const W = innerWidth, H = innerHeight, f = H / 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  tags.forEach(t => {
    const i = +t.dataset.i, w = worldOf(i);
    v3.copy(w).project(camera);
    if (v3.z > 1) { t.style.visibility = "hidden"; return; }
    t.style.visibility = "";

    const cx = (v3.x * 0.5 + 0.5) * W, cy = (-v3.y * 0.5 + 0.5) * H;
    if (i === 6) { t.style.transform = `translate(${(cx - t.offsetWidth / 2).toFixed(1)}px, ${(cy + rp * 1.05 + 8).toFixed(1)}px)`; return; }
    const x = Math.min(cx + rp * 0.72, W - t.offsetWidth - 6);
    t.style.transform = `translate(${x.toFixed(1)}px, ${(cy - rp * 0.72 - 26).toFixed(1)}px)`;
  });
}

/* ---------- ввод: наведение, нажатие, вращение пальцем ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

canvas.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY, th: rig.theta, moved: false, t: performance.now() }; canvas.setPointerCapture(e.pointerId); });

  if (e.pointerType === "mouse") { rig.px = e.clientX / innerWidth - 0.5; rig.py = e.clientY / innerHeight - 0.5; }
  if (down) {
    const dx = e.clientX - down.x;
    if (Math.abs(dx) > 6 || Math.abs(e.clientY - down.y) > 6) down.moved = true;
    if (down.moved && cam.mode === "rig") { rig.thetaV = 0; rig.theta = down.th + dx * 0.006; canvas.classList.add("is-grab"); }
    return;
  }

});

  rig.dist = homeDist();
});

/* ---------- кадр ---------- */
const clock = new THREE.Clock();

  simT += dt * ts.v;
  sun.rotation.y += dt * 0.03;
  sun.material.uniforms.t.value = t;
  const pulse = 1 + Math.sin(t * 1.3) * 0.025;
  glowA.scale.set(SUN_R * 7.5 * pulse, SUN_R * 7.5 * pulse, 1);
  belt.rotation.y += dt * 0.012 * ts.v;
  planets.forEach(p => {
    const i = p.id;

    p.mesh.rotation.y += dt * p.rot * (focusI === i ? 0.4 : 1);
    if (p.clouds) p.clouds.rotation.y += dt * p.rot * 1.15;
    p.sats.forEach(s => { s.a += dt * s.sp * Math.max(ts.v, 0.25); s.m.position.set(Math.cos(s.a) * s.dist, Math.sin(s.a * 0.7) * 0.2, Math.sin(s.a) * s.dist); });

    if (!down) { rig.theta += (0.025 + rig.thetaV) * dt; rig.thetaV *= 0.95; }
    const save = [rig.px, rig.py]; rig.px = smx; rig.py = smy;
    rigPos(v3); rig.px = save[0]; rig.py = save[1];

  requestAnimationFrame(frame);
}

manager.onLoad = () => {
  rigPos(camera.position); camera.lookAt(ORIGIN);
  requestAnimationFrame(frame);
  APP.ready(api);
};
manager.onError = url => console.warn("Не загрузилась текстура", url);
</script>
</body>
