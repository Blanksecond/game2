<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03040a">
<meta name="robots" content="noindex">
<title>Девять миров до Солнца</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500&family=Onest:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<style>
/* =====================================================================
   «Девять миров до Солнца». Живая 3D-система: Three.js + GSAP.
   ===================================================================== */
:root {
  --bg: #03040a;
  --ink: #eef0f7;
  --muted: #8a90a6;
  --dim: #555b70;
  --sun: #ffb547;
  --sun-ink: #1a1206;
  --glass: rgba(12, 14, 26, 0.66);
  --glass-2: rgba(255, 255, 255, 0.06);
  --glass-3: rgba(255, 255, 255, 0.1);
  --edge: rgba(255, 255, 255, 0.09);
  --bad: #ff8a6b;

  --display: "Unbounded", system-ui, sans-serif;
  --text: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); overflow: hidden;
  font: 400 17px/1.55 var(--text);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body.is-flat { overflow: auto; }
img { display: block; max-width: 100%; }
h1, h2, h3, p { margin: 0; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }
::selection { background: var(--sun); color: var(--sun-ink); }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }

/* split-текст: каждая буква выезжает из-под маски */
.split .w { display: inline-block; white-space: nowrap; }
.split .c { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.16em 0 0.1em; margin: -0.16em 0 -0.1em; }
.split .c > span { display: inline-block; will-change: transform; }

/* ---------- кнопки ---------- */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 0 26px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--sun); color: var(--sun-ink); font: 500 15px/1 var(--text); letter-spacing: 0.01em;
  text-decoration: none; overflow: hidden; isolation: isolate;
  transition: transform 160ms var(--ease-out), opacity 200ms ease;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.btn::after { content: ""; position: absolute; inset: 0; z-index: -1; background: #fff; transform: translateY(101%); transition: transform 420ms var(--ease-out); }
.btn:active { transform: scale(0.97); }
.btn--glass { background: var(--glass-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--edge); }
.btn--glass::after { background: var(--glass-3); }
.btn--small { min-height: 40px; padding: 0 16px; font-size: 13px; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:disabled:active { transform: none; }
@media (hover: hover) and (pointer: fine) {
  .btn:not(:disabled):hover::after { transform: translateY(0); }
}
.link { background: none; border: 0; padding: 6px 0; cursor: pointer; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }

/* ---------- сцена ---------- */
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#gl.is-grab { cursor: grabbing; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.75) 100%); }

/* ---------- прелоадер ---------- */
.loader { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; grid-template-rows: 1fr auto; padding: 28px; clip-path: inset(0 0 0 0); }
.loader__top { display: flex; justify-content: space-between; color: var(--muted); }
.loader__num { font: 300 clamp(96px, 22vw, 320px)/0.8 var(--display); letter-spacing: -0.04em; justify-self: end; font-variant-numeric: tabular-nums; }
.loader__bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--sun); transform-origin: 0 50%; transform: scaleX(0); transition: transform 300ms ease; }

/* ---------- вход ---------- */
.gate { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px; pointer-events: none; }
.gate__in { width: min(100%, 980px); display: grid; justify-items: center; gap: 36px; text-align: center; pointer-events: auto; }
.gate h1 { font: 300 clamp(38px, 8.4vw, 124px)/0.95 var(--display); letter-spacing: -0.03em; text-transform: uppercase; }
.gate__lead { max-width: 40ch; color: var(--muted); font-size: 18px; }
.gate .btn { min-width: 260px; min-height: 58px; font-size: 16px; }

/* ---------- HUD ---------- */
.hud { position: fixed; z-index: 10; pointer-events: none; opacity: 0; }
.hud > * { pointer-events: auto; }
.hud--tl { top: 24px; left: 28px; display: grid; gap: 4px; }
.hud--tl b { font: 400 15px/1.2 var(--display); letter-spacing: 0.02em; }
.hud--tl span { color: var(--muted); }
.hud--tr { top: 20px; right: 24px; display: flex; gap: 8px; align-items: center; }
.count { font: 400 13px var(--mono); color: var(--muted); padding: 0 10px; }
.count b { color: var(--ink); font-weight: 500; }
.hud--bottom { left: 50%; bottom: 24px; transform: translateX(-50%); display: grid; justify-items: center; gap: 12px; width: min(100% - 32px, 760px); }
.hint { color: var(--muted); text-align: center; }
.hud--bottom .coords { padding: 8px 14px; border-radius: 999px; background: var(--glass-2); box-shadow: inset 0 0 0 1px var(--edge); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

/* метки планет */
.labels { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
.tag { position: absolute; left: 0; top: 0; display: flex; align-items: flex-start; background: none; border: 0; padding: 0; cursor: pointer; pointer-events: auto; color: var(--ink); text-align: left; transition: opacity 400ms ease; will-change: transform; }
.tag__line { width: 26px; height: 26px; flex: none; position: relative; }
.tag__line::before { content: ""; position: absolute; left: 0; bottom: 0; width: 36px; height: 1px; background: rgba(255, 255, 255, 0.45); transform-origin: 0 0; transform: rotate(-45deg); }
.tag__line::after { content: ""; position: absolute; left: -3px; bottom: -3px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.tag__txt { display: grid; gap: 2px; padding: 4px 10px 6px; border-radius: 10px; transform: translateY(-14px); transition: background-color 250ms ease; }
.tag__txt b { font: 400 14px/1.2 var(--display); letter-spacing: 0.02em; white-space: nowrap; }
.tag__txt span { font: 400 10.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.tag.is-done .tag__line::after { background: var(--sun); box-shadow: 0 0 0 4px rgba(255, 181, 71, 0.2); }
.tag.is-done .tag__txt span { color: var(--sun); }
.tag.is-locked { opacity: 0.4; }
.tag.is-next .tag__line::after { background: var(--sun); animation: ping 1.6s ease-out infinite; }
.tag.is-next .tag__txt span { color: var(--ink); }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(255, 181, 71, 0.6); } 100% { box-shadow: 0 0 0 12px rgba(255, 181, 71, 0); } }
.tag.is-hover .tag__txt, .tag:focus-visible .tag__txt { background: var(--glass); }
.labels.is-off .tag { opacity: 0; pointer-events: none; }
.tag[data-i="6"] .tag__line { display: none; }
.tag[data-i="6"] .tag__txt { transform: none; text-align: center; justify-items: center; }

/* ---------- панель планеты ---------- */
.panel {
  position: fixed; z-index: 20; top: 12px; right: 12px; bottom: 12px; width: min(580px, 46vw);
  border-radius: 28px; background: var(--glass); backdrop-filter: blur(22px) saturate(1.2); -webkit-backdrop-filter: blur(22px) saturate(1.2);
  box-shadow: inset 0 0 0 1px var(--edge); overflow: hidden;
  transform: translateX(calc(100% + 24px)); transition: transform 760ms var(--ease-drawer);
}
.panel.is-open { transform: none; }
.panel__scroll { height: 100%; overflow-y: auto; overscroll-behavior: contain; padding: 0 28px 48px; display: grid; align-content: start; }
.panel__head { display: flex; justify-content: space-between; align-items: center; gap: 12px; position: sticky; top: 0; margin: 0 -28px; padding: 22px 28px 14px; z-index: 2; background: linear-gradient(rgba(12, 14, 26, 0.92) 60%, rgba(12, 14, 26, 0)); }
.panel__idx { color: var(--muted); }
.panel { --pw: calc(min(580px, 46vw) - 56px); }
.pname { margin-top: 7vh; font: 300 min(clamp(44px, 6vw, 100px), calc(var(--pw) / var(--n, 6) * 1.12))/0.92 var(--display); letter-spacing: -0.04em; text-transform: uppercase; overflow-wrap: anywhere; }
.pmeta { margin-top: 18px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }
.pmeta span::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--sun); margin-right: 8px; vertical-align: 1px; }
.pstory { margin-top: 24px; font-size: 19px; line-height: 1.45; max-width: 40ch; }
.pstory:empty { display: none; }
.pintro { margin-top: 28px; display: grid; gap: 18px; }
.pintro:empty { display: none; }
.steps { margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { list-style: none; display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: baseline; padding: 14px 16px; border-radius: 16px; background: var(--glass-2); }
.steps li i { font: normal 400 12px var(--mono); color: var(--sun); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- этапы заданий ---------- */
.stage { margin-top: 28px; display: grid; gap: 16px; justify-items: start; min-width: 0; }
.stage:empty { display: none; }
.step { color: var(--sun); }
.task { max-width: 42ch; font-size: 17px; }
.fact { max-width: 46ch; padding: 18px 20px; border-radius: 18px; background: var(--glass-2); box-shadow: inset 0 0 0 1px var(--edge); }
.fact b { font-weight: 500; color: var(--sun); }
.field { display: grid; gap: 8px; width: 100%; }
.field label { font-size: 14px; color: var(--muted); }
.input { width: 100%; min-height: 54px; padding: 0 18px; border: 0; border-radius: 16px; background: rgba(255, 255, 255, 0.07); box-shadow: inset 0 0 0 1px var(--edge); color: var(--ink); font-size: 17px; transition: box-shadow 200ms ease, background-color 200ms ease; }
.input:focus { outline: none; box-shadow: inset 0 0 0 1px rgba(255, 181, 71, 0.6); background: rgba(255, 255, 255, 0.09); }
.input.is-bad { box-shadow: inset 0 0 0 1px rgba(255, 138, 107, 0.7); }
.msg { min-height: 1.4em; color: var(--bad); font-size: 14px; }
.note { color: var(--muted); font-size: 14px; max-width: 44ch; }
.shake { animation: shake 360ms var(--ease-out); }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

/* Плутон: фонарик */
.torch { width: 100%; aspect-ratio: 1.6; border-radius: 18px; background: #000; touch-action: none; box-shadow: inset 0 0 0 1px var(--edge); }
/* стихи и шифры */
.poem { width: 100%; font: 400 17px/1.65 var(--text); padding: 18px 20px; border-radius: 18px; background: var(--glass-2); box-shadow: inset 0 0 0 1px var(--edge); }
.poem p { margin: 0; }
.poem .acro { color: var(--sun); font-weight: 500; display: inline-block; }
.poem--num p:nth-child(4n) { margin-bottom: 10px; }
.poem .n { display: inline-block; width: 2.4em; color: var(--dim); font: 400 12px var(--mono); }
.codes { display: flex; flex-wrap: wrap; gap: 6px; }
.codes span { font: 500 15px var(--mono); padding: 8px 12px; border-radius: 10px; background: rgba(255, 181, 71, 0.12); color: var(--sun); }
/* Сатурн */
.disk { width: min(100%, 400px); aspect-ratio: 1; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.disk text { font: 500 13px var(--text); text-anchor: middle; dominant-baseline: middle; }
.disk .outer text { fill: var(--ink); }
.disk .inner text { fill: var(--sun); }
.disk .inner { transition: transform 220ms var(--ease-out); }
.disk.is-drag .inner { transition: none; }
.cipher { font: 300 20px/1.5 var(--display); letter-spacing: 0.1em; color: var(--sun); word-spacing: 0.4em; }
/* Юпитер */
.stego { width: 100%; height: auto; aspect-ratio: 2; border-radius: 18px; background: #000; image-rendering: pixelated; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--glass-2); box-shadow: inset 0 0 0 1px var(--edge); color: var(--ink); cursor: pointer; font-size: 14px; transition: background-color 200ms ease, transform 160ms var(--ease-out); }
.seg button:active { transform: scale(0.97); }
.seg button[aria-pressed="true"] { background: var(--sun); color: var(--sun-ink); box-shadow: none; }
.range { width: 100%; accent-color: var(--sun); }
/* Марс */
.beacon { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
.lamp { width: 72px; height: 72px; flex: none; border-radius: 50%; background: #2a1810; box-shadow: inset 0 0 0 2px rgba(255, 140, 90, 0.25); }
.lamp.is-on { background: #ff9a5a; box-shadow: 0 0 40px 10px rgba(255, 140, 80, 0.55), inset 0 0 0 2px #ffd0a8; }
.morse { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; width: 100%; }
.morse span { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 10px; background: var(--glass-2); font: 400 13px var(--mono); }
.morse b { font: 500 14px var(--text); }
.tape { font: 500 16px var(--mono); color: var(--sun); letter-spacing: 0.08em; }
.tape:empty { display: none; }
/* Земля: Telegram */
.tg { width: 100%; max-width: 420px; border-radius: 20px; overflow: hidden; background: #0e1621; box-shadow: inset 0 0 0 1px var(--edge); }
.tg__head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #17212b; }
.tg__ava { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #e8954a; color: #1a1206; font-weight: 500; }
.tg__head b { display: block; font-weight: 500; }
.tg__head small { color: #7f91a4; font-size: 13px; }
.tg__body { padding: 18px 14px 22px; display: grid; gap: 10px; justify-items: start; min-height: 150px; }
.tg__date { justify-self: center; font-size: 13px; color: #c9d4df; background: rgba(0, 0, 0, 0.3); padding: 3px 10px; border-radius: 999px; }
.tg__msg { max-width: 80%; padding: 8px 12px 6px; border-radius: 14px 14px 14px 4px; background: #182533; display: flex; align-items: flex-end; gap: 10px; font-size: 18px; }
.tg__msg small { color: #6d8299; font-size: 12px; }
.tg__noise { color: #6d8299; letter-spacing: 0.1em; animation: noise 0.18s steps(2) infinite; }
@keyframes noise { 50% { opacity: 0.3; } }
/* Венера */
.vmap { width: 100%; }
.vmap canvas { width: 100%; aspect-ratio: 2; border-radius: 16px; display: block; cursor: crosshair; touch-action: none; background: #000; }
.vread { font: 500 13px var(--mono); color: var(--sun); min-height: 1.4em; }
/* Солнце и координаты */
.coords { font: 400 13px var(--mono); letter-spacing: 0.06em; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: center; }
.coords i { font-style: normal; color: var(--ink); display: inline-block; }
.coords i.is-empty { color: var(--dim); }
.coords--big { font: 300 clamp(24px, 4.6vw, 38px)/1.25 var(--display); color: var(--ink); justify-content: flex-start; letter-spacing: 0; }
.letter { padding: 28px 24px; border-radius: 22px; background: var(--ink); color: #14151c; display: grid; gap: 16px; width: 100%; font-size: 18px; line-height: 1.5; }
.letter .sig { font-family: var(--display); text-align: right; }
.caption { position: fixed; left: 50%; bottom: 14vh; transform: translateX(-50%); z-index: 15; width: min(92vw, 1000px); text-align: center; pointer-events: none; font: 300 clamp(22px, 4.2vw, 56px)/1.1 var(--display); text-transform: uppercase; letter-spacing: -0.02em; text-shadow: 0 0 30px rgba(0, 0, 0, 0.85), 0 0 4px rgba(0, 0, 0, 0.6); }

/* ---------- принятый сигнал ---------- */
.post { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; overflow-y: auto; background: rgba(2, 3, 8, 0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.signal { width: min(520px, 100%); padding: 32px 26px 26px; border-radius: 28px; background: var(--glass); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); box-shadow: inset 0 0 0 1px var(--edge), 0 40px 120px rgba(0, 0, 0, 0.6); display: grid; gap: 16px; justify-items: center; text-align: center; }
.signal__from { color: var(--sun); }
.signal__digit { font: 300 clamp(120px, 28vw, 190px)/0.85 var(--display); color: var(--ink); text-shadow: 0 0 60px rgba(255, 181, 71, 0.55); }
.signal__note { color: var(--muted); max-width: 36ch; }
.signal .btn { width: 100%; }

/* ---------- маршрут ---------- */
.drawer { position: fixed; z-index: 30; top: 12px; left: 12px; bottom: 12px; width: min(420px, calc(100vw - 24px)); border-radius: 28px; background: var(--glass); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); box-shadow: inset 0 0 0 1px var(--edge); transform: translateX(calc(-100% - 24px)); transition: transform 640ms var(--ease-drawer); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
.drawer.is-open { transform: none; }
.drawer__head { display: flex; justify-content: space-between; align-items: center; padding: 22px 22px 8px; }
.drawer__head h2 { font: 400 22px var(--display); }
.drawer__list { overflow-y: auto; padding: 8px 12px 24px; display: grid; gap: 6px; align-content: start; }
.ditem { display: grid; grid-template-columns: 48px 1fr auto; gap: 14px; align-items: center; padding: 10px; border: 0; border-radius: 18px; background: none; color: inherit; text-align: left; cursor: pointer; transition: background-color 200ms ease; }
@media (hover: hover) and (pointer: fine) { .ditem:hover { background: var(--glass-2); } }
.ditem__ball, .flat__ball { width: 48px; height: 48px; border-radius: 50%; background: #111 center / 200% 100%; box-shadow: inset -10px -6px 18px rgba(0, 0, 0, 0.7); }
.ditem[aria-disabled="true"] { opacity: 0.45; }
.ditem b { font: 400 16px var(--display); display: block; }
.ditem small { color: var(--muted); font-size: 13px; }
.ditem .mono { color: var(--muted); }
.ditem.is-done .mono { color: var(--sun); }
.credits { margin: 18px 10px 0; color: var(--dim); font-size: 12px; line-height: 1.5; }

/* ---------- финальная фраза поверх сцены ---------- */

/* ---------- курсор ---------- */
.cursor { position: fixed; left: 0; top: 0; z-index: 200; pointer-events: none; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.55); transition: width 300ms var(--ease-out), height 300ms var(--ease-out), margin 300ms var(--ease-out), background-color 300ms ease; display: grid; place-items: center; mix-blend-mode: difference; }
.cursor span { font: 500 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: #fff; opacity: 0; transition: opacity 200ms ease; }
.cursor.is-big { width: 86px; height: 86px; margin: -43px 0 0 -43px; background: rgba(255, 255, 255, 0.12); }
.cursor.is-big span { opacity: 1; }
@media not all and (hover: hover) and (pointer: fine) { .cursor { display: none; } }

/* ---------- плоский режим без WebGL ---------- */
.flat { padding: 96px 16px 140px; display: grid; gap: 28px; max-width: 1100px; margin: 0 auto; }
.flat h1 { font: 300 clamp(36px, 7vw, 96px)/0.95 var(--display); text-transform: uppercase; letter-spacing: -0.03em; }
.flat__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.flat__grid button { border: 0; padding: 0 0 14px; border-radius: 22px; background: var(--glass-2); color: inherit; cursor: pointer; overflow: hidden; display: grid; gap: 10px; text-align: center; }
.flat__ball { width: 64%; height: auto; aspect-ratio: 1; justify-self: center; margin-top: 16px; }
.flat__grid button:disabled { opacity: 0.4; cursor: default; }
.flat__grid b { font: 400 16px var(--display); }

/* ---------- телефон ---------- */
@media (max-width: 760px) {
  body { font-size: 16px; }
  .hud--tl { top: 16px; left: 16px; }
  .hud--tl b { font-size: 13px; }
  .hud--tl span { display: none; }
  .hud--tr { top: 10px; right: 10px; }
  .hud--bottom { bottom: max(16px, env(safe-area-inset-bottom)); }
  .hud--bottom .coords { font-size: 12px; }
  .tag__txt b { font-size: 12px; }
  .tag__txt span { display: none; }
  .tag[data-i="6"] .tag__txt span { display: block; }
  .tag__line { width: 16px; height: 16px; }
  .tag__line::before { width: 23px; }
  .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 56svh; border-radius: 26px; transform: translateY(calc(100% + 24px)); transition: transform 700ms var(--ease-drawer), height 600ms var(--ease-drawer); }
  .panel.is-play { height: calc(100svh - 16px); }
  .panel__scroll { padding: 0 18px 48px; }
  .panel__head { margin: 0 -18px; padding: 16px 18px 10px; }
  .panel { --pw: calc(100vw - 52px); }
  .pname { margin-top: 6px; font-size: min(clamp(38px, 12.5vw, 64px), calc(var(--pw) / var(--n, 6) * 1.12)); }
  .pstory { font-size: 17px; margin-top: 14px; }
  .postcard { grid-template-columns: 1fr; gap: 16px; padding: 16px; }
  .postcard__stamp { aspect-ratio: 16 / 9; }
  .loader { padding: 20px; }
  .gate__in { gap: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  .panel, .drawer { transition-duration: 1ms; }
  .rose .pt.is-next .core { animation: none; }
  .card__in, .rover, .disk .inner { transition: none; }
}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="labels" id="labels" aria-label="Планеты"></div>

<header class="hud hud--tl"><b>Девять миров до Солнца</b><span class="mono">От Плутона к Солнцу · 9 сигналов</span></header>
<div class="hud hud--tr">
  <span class="count" id="count"><b>0</b>/6</span>
  <button class="btn btn--glass btn--small" type="button" id="routeBtn">Маршрут</button>
</div>
<div class="hud hud--bottom" id="hudBottom">
  <p class="hint mono" id="hint">Нажми на планету · тяни, чтобы повернуть</p>
  <div class="coords" id="coords" aria-label="Собранные координаты"></div>
</div>

<div class="caption" id="caption" hidden aria-live="polite"></div>

<aside class="panel" id="panel" aria-labelledby="pName" aria-hidden="true">
  <div class="panel__scroll" id="pScroll">
    <div class="panel__head">
      <button class="btn btn--glass btn--small" type="button" id="pBack">← К системе</button>
      <span class="mono panel__idx" id="pIdx"></span>
    </div>
    <h2 class="pname" id="pName"></h2>
    <p class="mono pmeta" id="pMeta"></p>
    <p class="pstory" id="pStory"></p>
    <div class="pintro" id="pIntro"></div>
    <div class="stage" id="stage"></div>
  </div>
</aside>

<aside class="drawer" id="drawer" aria-labelledby="drawerTitle" aria-hidden="true">
  <div class="drawer__head"><h2 id="drawerTitle">Маршрут</h2><button class="btn btn--glass btn--small" type="button" id="drawerClose">Закрыть</button></div>
  <div class="drawer__list" id="drawerList"></div>
</aside>

<div class="post" id="post" role="dialog" aria-modal="true" aria-labelledby="sigTitle" hidden>
  <div class="signal" id="postcard">
    <p class="mono signal__from" id="sigTitle"></p>
    <p class="signal__digit" id="sigDigit"></p>
    <p class="signal__note" id="sigNote"></p>
    <div class="coords" id="sigCoords"></div>
    <button class="btn" type="button" id="postClose"></button>
  </div>
</div>

<section class="gate" id="gate" hidden aria-labelledby="gateTitle">
  <div class="gate__in">
    <h1 id="gateTitle">Девять миров до Солнца</h1>
    <p class="gate__lead" id="gateLead">Путешествие от холодного Плутона к Солнцу. На каждом мире задание и одна цифра координат. Куда они ведут, узнаешь в самом конце.</p>
    <button class="btn" type="button" id="startBtn">Начать путешествие</button>
  </div>
</section>

<div class="loader" id="loader">
  <div class="loader__top mono"><span>Загрузка системы</span><span>Для Насти</span></div>
  <div class="loader__num" id="loaderNum">0</div>
  <div class="loader__bar" id="loaderBar"></div>
</div>

<main class="flat" id="flat" hidden></main>
<div class="cursor" id="cursor" aria-hidden="true"><span>Лететь</span></div>

<script>
/* =====================================================================
   НАСТРОЙКИ — всё, что нужно поменять под себя, находится здесь.
   Кодовое слово для Сатурна хранится как SHA-256, чтобы его нельзя
   было подсмотреть в коде. Хеш нового слова: открой сайт с #dev
   в конце адреса (index.html#dev) и введи слово в генератор в «Маршруте».
   ===================================================================== */
const CONFIG = {
  her: "Кисуня",
  him: "Муся",
  firstMessage: { text: "ЙО", date: "25 марта 2023", hiddenFor: "Кисуни" },
  // Куда в финале показывают собранные координаты, и откуда она
  home: { name: "Москва", lat: 55.7558, lon: 37.6 },
  hers: { name: "Крымск", lat: 44.93, lon: 37.98 },
  saturn: {
    phrase: "Напиши Мусе Хьюстон у нас проблема", // это она расшифрует на кольцах
    codeHash: "86b43943b2c974c95eb45729f7f8ca5d74f857f547fad7b05722a83255a26784" // кодовое слово «орбита»: его отвечает Муся
  },
  letter: [
    "Кисуня,",
    "помнишь моё «ЙО»? 25 марта 2023 года я написал тебе две буквы и даже не догадывался, что пишу человеку, вокруг которого закрутится вся моя жизнь.",
    "Между Москвой и Крымском 1200 километров. Свет пролетает их за четыре тысячных секунды. Мне пока дольше, но я всё равно лечу к тебе, как ты сейчас летела от Плутона к Солнцу.",
    "Ты моё Солнце. Чем ближе к тебе, тем теплее."
  ],
  signature: "Твой Муся"
};

// Маршрут: от холодного края к Солнцу. id — номер тела в 3D-сцене, digit — цифра координат
const STOPS = [
  { id: 9, key: "pluto", name: "Плутон", from: "с Плутона", temp: "−230 °C", light: "5 ч 30 мин света от Солнца", tex: "pluto-map.jpg", digit: 5,
    fact: "Плутон и его луна Харон всегда смотрят друг на друга одной стороной: так и кружат, не отводя глаз. А на самом Плутоне есть огромное светлое сердце, равнина Томбо, шириной около полутора тысяч километров. Даже на самом холодном краю системы.",
    steps: ["Включи фонарик и обыщи Плутон", "Найди четыре светящиеся надписи"] },
  { id: 5, key: "neptune", name: "Нептун", from: "с Нептуна", temp: "−214 °C", light: "4 ч 10 мин света от Солнца", tex: "2k_neptune.jpg", digit: 5,
    fact: "Нептун открыли в 1846 году, не увидев: Урбен Леверье вычислил его на бумаге по тому, как что-то невидимое тянет соседний Уран. Так и бывает: сначала чувствуешь притяжение, а потом видишь.",
    steps: ["Вычисли день недели первого сообщения", "Посчитай, сколько дней прошло до 2026 года"] },
  { id: 8, key: "uranus", name: "Уран", from: "с Урана", temp: "−224 °C", light: "2 ч 40 мин света от Солнца", tex: "2k_uranus.jpg", digit: 7,
    fact: "Уран лежит на боку и кружит так уже миллиарды лет. Его луны названы в честь героинь Шекспира: среди них есть Джульетта, Офелия и Миранда.",
    steps: ["Прочитай стихи с Урана", "Найди имя, которое в них спрятано"] },
  { id: 4, key: "saturn", name: "Сатурн", from: "с Сатурна", temp: "−140 °C", light: "1 ч 19 мин света от Солнца", tex: "2k_saturn.jpg", digit: 5,
    fact: "Сатурн легче воды: в огромной ванне он бы плавал. А его кольца не вечные, когда-нибудь они осыплются дождём на планету. Вечного мало, поэтому важное лучше говорить сразу.",
    steps: ["Расшифруй послание на кольцах", "Выйди на связь с ЦУПом и получи код"] },
  { id: 3, key: "jupiter", name: "Юпитер", from: "с Юпитера", temp: "−110 °C", light: "43 минуты света от Солнца", tex: "2k_jupiter.jpg", digit: 5,
    fact: "По мифу Юпитер прятал свои похождения за облаками, но его жена Юнона видела сквозь них. Поэтому зонд NASA, который смотрит сквозь облака Юпитера, назвали «Юнона».",
    steps: ["Посмотри на облака глазами Юноны", "Прочитай, что за ними спрятано"] },
  { id: 2, key: "mars", name: "Марс", from: "с Марса", temp: "−60 °C", light: "13 минут света от Солнца", tex: "2k_mars.jpg", digit: 8,
    fact: "Каждый День святого Валентина учёные публикуют снимки сердец, найденных на поверхности Марса: кратеров и холмов такой формы там хватает. А закаты на Марсе голубые.",
    steps: ["Прими сигнал марсохода", "Расшифруй морзянку"] },
  { id: 1, key: "earth", name: "Земля", from: "с Земли", temp: "+15 °C", light: "8 минут света от Солнца", tex: "2k_earth_daymap.jpg", digit: 3,
    fact: "Луна каждый год отдаляется от Земли примерно на 3,8 сантиметра. С нами всё наоборот. Здесь, на Земле, 25 марта 2023 года всё и началось.",
    steps: ["Восстанови первое сообщение", "Посчитай, сколько ему лет"] },
  { id: 0, key: "venus", name: "Венера", from: "с Венеры", temp: "+464 °C", light: "6 минут света от Солнца", tex: "2k_venus_atmosphere.jpg", digit: 7,
    fact: "Почти всё на Венере названо в честь женщин: горы, равнины, кратеры. Маленьким кратерам дают женские имена. И среди них есть один, который назвали так же, как тебя.",
    steps: ["Научись читать координаты Венеры", "Найди кратер 49° ю. ш., 276° в. д."] },
  { id: 7, key: "mercury", name: "Меркурий", from: "с Меркурия", temp: "+430 °C", light: "3 минуты света от Солнца", tex: "2k_mercury.jpg", digit: 6,
    fact: "Кратеры Меркурия называют в честь поэтов, писателей и композиторов, есть там и кратер Пушкин. А сутки на Меркурии длятся ровно два его года.",
    steps: ["Найди слова в стихах Пушкина по шифру", "Собери послание"] }
];
const SUN = { id: 6, key: "sun", name: "Солнце", temp: "+5500 °C", light: "центр системы", tex: "2k_sun.jpg",
  fact: "Свет Солнца летит до Земли восемь минут. Всё в этой системе вращается вокруг него. Как и всё моё вокруг тебя.",
  steps: ["Собери координаты из девяти сигналов", "Наведи телескоп"] };

/* ===================================================================== */

const ROUTE = STOPS.map(s => s.id);
const BODY = id => id === 6 ? SUN : STOPS.find(s => s.id === id);
const TEX = f => `photos/textures/${f}`;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DEV = location.hash === "#dev";
const G = window.gsap || null;
const wait = ms => new Promise(r => setTimeout(r, REDUCED ? Math.min(ms, 300) : ms));
const num = n => String(n + 1).padStart(2, "0"); // номер остановки: 01…09

/* ---------- хеши ---------- */
const norm = s => String(s).toLowerCase().replace(/ё/g, "е").replace(/[^a-zа-я0-9]/g, "");
async function sha(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(norm(s)));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

/* ---------- прогресс ---------- */
const KEY = "nebo-progress-v3";
let state = { done: [] };
try { const raw = localStorage.getItem(KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const isDone = id => state.done.includes(id);
const doneCount = () => ROUTE.filter(isDone).length;
const nextId = () => ROUTE.find(id => !isDone(id)) ?? 6;
const isOpen = id => DEV || (id === 6 ? doneCount() === ROUTE.length : ROUTE.slice(0, ROUTE.indexOf(id)).every(isDone));
const shake = n => { n.classList.remove("shake"); void n.offsetWidth; n.classList.add("shake"); };
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }

/* координаты собираются из цифр: 55.7558° с. ш., 37.6° в. д. */
function coordsHTML(all) {
  const d = k => all || isDone(STOPS[k].id) ? `<i>${STOPS[k].digit}</i>` : `<i class="is-empty">_</i>`;
  return `<span>${d(0)}${d(1)}.${d(2)}${d(3)}${d(4)}${d(5)}° с. ш.,&nbsp;</span><span>${d(6)}${d(7)}.${d(8)}° в. д.</span>`;
}
const distKm = () => {
  const r = x => x * Math.PI / 180, a = CONFIG.home, b = CONFIG.hers;
  const h = Math.sin(r(b.lat - a.lat) / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(r(b.lon - a.lon) / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h));
};

/* ---------- split-текст ---------- */
function split(node, text) {
  node.classList.add("split");
  node.setAttribute("aria-label", text);
  node.innerHTML = text.split(" ").map(w => `<span class="w" aria-hidden="true">${[...w].map(c => `<span class="c"><span>${esc(c)}</span></span>`).join("")}</span>`).join(" ");
  return node.querySelectorAll(".c > span");
}
function reveal(node, text, delay = 0) {
  const chars = split(node, text);
  if (G && !REDUCED) G.fromTo(chars, { yPercent: 115 }, { yPercent: 0, duration: 1.1, ease: "expo.out", stagger: 0.028, delay });
}

/* =====================================================================
   3D: модуль внизу страницы вызывает APP.progress и APP.ready.
   Если WebGL или библиотеки не загрузились, работает плоский режим.
   ===================================================================== */
const APP = window.APP = { gl: null, live: false, focused: -1, playing: -1 };
let booted = false;

APP.progress = p => {
  $("#loaderNum").textContent = Math.round(p * 100);
  $("#loaderBar").style.transform = `scaleX(${p})`;
};
APP.ready = api => { APP.gl = api; boot(); };
APP.pick = i => { if (APP.live) openPlanet(i); };
APP.hover = i => {
  if (!APP.live) i = -1;
  document.querySelectorAll(".tag").forEach(t => t.classList.toggle("is-hover", +t.dataset.i === i));
  $("#cursor").classList.toggle("is-big", i >= 0);
  $("#gl").style.cursor = i >= 0 ? "pointer" : "";
  APP.gl?.setHover(i);
};

function boot() {
  if (booted) return; booted = true;
  const out = () => { $("#loader").remove(); if (DEV) enter(false); else showStart(); };
  APP.progress(1);
  if (G && !REDUCED) {
    G.timeline({ onComplete: out })
      .to("#loaderNum", { yPercent: -30, opacity: 0, duration: 0.6, ease: "power3.in", delay: 0.3 })
      .to("#loader", { clipPath: "inset(0% 0% 100% 0%)", duration: 1, ease: "expo.inOut" }, "-=0.1");
  } else out();
}
function bootFlat() {
  if (booted) return; booted = true;
  document.body.classList.add("is-flat");
  ["#gl", ".vignette", "#labels"].forEach(s => $(s).hidden = true);
  $("#loader").remove();
  if (DEV) enter(false); else showStart();
}
// если WebGL нет или 3D не ответило за 15 секунд — плоский режим
(() => {
  let ok = false;
  try { const c = document.createElement("canvas"); ok = !!(window.WebGLRenderingContext && (c.getContext("webgl2") || c.getContext("webgl"))); } catch (e) {}
  if (!ok || !G) { setTimeout(bootFlat, 50); return; }
  setTimeout(() => { if (!APP.gl) bootFlat(); }, 15000);
})();

/* ---------- стартовый экран ---------- */
function showStart() {
  $("#gate").hidden = false;
  $("#startBtn").textContent = doneCount() ? "Продолжить путешествие" : "Начать путешествие";
  reveal($("#gateTitle"), "Семь планет до Солнца", 0.1);
  if (G && !REDUCED) G.from(["#gateLead", "#startBtn"], { y: 30, opacity: 0, duration: 1.2, ease: "expo.out", stagger: 0.1, delay: 0.8 });
  $("#startBtn").onclick = () => {
    const go = () => { $("#gate").hidden = true; enter(true); };
    if (G && !REDUCED) G.to("#gate", { opacity: 0, filter: "blur(12px)", scale: 1.04, duration: 0.9, ease: "power3.in", onComplete: go });
    else go();
  };
}

/* ---------- главный экран ---------- */
function enter(intro) {
  APP.live = true;
  buildLabels();
  refresh();
  if (APP.gl) {
    APP.gl.intro(intro);
    if (G && !REDUCED) {
      G.to(".hud", { opacity: 1, duration: 1.2, ease: "power2.out", stagger: 0.12, delay: intro ? 3 : 0.5 });
      G.fromTo(".tag", { opacity: 0 }, { opacity: 1, duration: 1, stagger: 0.06, delay: intro ? 3.4 : 0.8, clearProps: "opacity" });
    } else document.querySelectorAll(".hud").forEach(h => h.style.opacity = 1);
  } else {
    document.querySelectorAll(".hud").forEach(h => h.style.opacity = 1);
    renderFlat();
  }
  bindCursor();
}
function refresh() {
  const n = doneCount(), nx = nextId();
  $("#count").innerHTML = `<b>${n}</b>/9`;
  $("#coords").innerHTML = coordsHTML(false);
  $("#hint").textContent = n === ROUTE.length ? "Все сигналы приняты · лети к Солнцу" : `Следующая остановка: ${BODY(nx).name} · тяни, чтобы повернуть`;
  document.querySelectorAll(".tag").forEach(t => {
    const id = +t.dataset.i, d = isDone(id), open = isOpen(id);
    t.classList.toggle("is-done", d);
    t.classList.toggle("is-next", id === nx);
    t.classList.toggle("is-locked", !open && !d);
    $(".tag__txt span", t).textContent = id === 6 ? (n === ROUTE.length ? "финал открыт" : `финал · ещё ${ROUTE.length - n}`) : d ? `${num(ROUTE.indexOf(id))} · сигнал принят` : id === nx ? `${num(ROUTE.indexOf(id))} · следующая` : `${num(ROUTE.indexOf(id))} · закрыто`;
  });
  APP.gl?.setDone(state.done, nx);
  renderDrawer();
}
function buildLabels() {
  $("#labels").innerHTML = [...ROUTE, 6].map(id => `<button class="tag" type="button" data-i="${id}" aria-label="${esc(BODY(id).name)}"><span class="tag__line"></span><span class="tag__txt"><b>${esc(BODY(id).name)}</b><span></span></span></button>`).join("");
  $("#labels").onclick = e => { const t = e.target.closest(".tag"); if (t) openPlanet(+t.dataset.i); };
  $("#labels").onmouseover = e => { const t = e.target.closest(".tag"); if (t) APP.hover(+t.dataset.i); };
  $("#labels").onmouseout = e => { if (e.target.closest(".tag")) APP.hover(-1); };
}
function renderFlat() {
  const f = $("#flat"); f.hidden = false;
  f.innerHTML = `<h1>Семь планет до&nbsp;Солнца</h1><p class="pstory">Путешествие от холодного Плутона к Солнцу. На каждой планете задание и одна цифра координат.</p>
    <div class="flat__grid">${[...ROUTE, 6].map(id => `<button type="button" data-i="${id}" ${isOpen(id) ? "" : "disabled"}><span class="flat__ball" style="background-image:url(${TEX(BODY(id).tex)})"></span><b>${esc(BODY(id).name)}</b><span class="mono" style="color:var(--muted)">${id === 6 ? "финал" : isDone(id) ? "принято" : isOpen(id) ? "открыто" : "закрыто"}</span></button>`).join("")}</div>`;
  f.onclick = e => { const b = e.target.closest("[data-i]"); if (b && !b.disabled) openPlanet(+b.dataset.i); };
}

/* ---------- курсор ---------- */
let cursorOn = false;
function bindCursor() {
  if (cursorOn || !matchMedia("(hover: hover) and (pointer: fine)").matches) return;
  cursorOn = true;
  const c = $("#cursor"); let x = innerWidth / 2, y = innerHeight / 2, cx = x, cy = y;
  addEventListener("pointermove", e => { x = e.clientX; y = e.clientY; }, { passive: true });
  (function tick() { cx += (x - cx) * 0.2; cy += (y - cy) * 0.2; c.style.transform = `translate(${cx}px, ${cy}px)`; requestAnimationFrame(tick); })();
}

/* =====================================================================
   ПАНЕЛЬ ПЛАНЕТЫ
   ===================================================================== */
function openPlanet(id) {
  if (!isOpen(id) && !isDone(id)) {
    const t = document.querySelector(`.tag[data-i="${id}"]`); if (t) shake(t);
    $("#hint").textContent = id === 6 ? `Солнце откроется, когда придут все девять сигналов. Осталось ${ROUTE.length - doneCount()}` : `Сначала ${BODY(nextId()).name}: планеты открываются по очереди`;
    return;
  }
  stopAll();
  APP.focused = id; APP.playing = -1;
  APP.hover(-1);
  const p = BODY(id), k = ROUTE.indexOf(id);
  closeDrawer();
  $("#labels").classList.add("is-off");

let timers = [], runId = 0;
const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
function stopAll() { timers.forEach(clearTimeout); timers = []; runId++; }

function answerField(stage, { label, hints = [], check, okText = "Проверить", onOk }) {
  const box = document.createElement("div");
  box.className = "field";
  const id = "in" + Math.random().toString(36).slice(2, 7);
  box.innerHTML = `<label for="${id}">${esc(label)}</label>
    <input class="input" id="${id}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <p class="msg" role="status"></p><p class="note" hidden></p>
    <div class="row"><button class="btn" type="button">${esc(okText)}</button>${hints.length ? '<button class="link" type="button">Подсказка</button>' : ""}</div>`;
  stage.appendChild(box);
  const inp = $("input", box), msg = $(".msg", box), hint = $(".note", box), [go, hb] = box.querySelectorAll(".row button");
  let shown = 0, fails = 0;
  const showHint = () => { if (shown < hints.length) { hint.hidden = false; hint.textContent = hints.slice(0, ++shown).join(" "); } if (shown >= hints.length && hb) hb.hidden = true; };
  const run = async () => {
    if (!inp.value.trim()) { inp.focus(); return; }
    if (await check(inp.value)) { inp.disabled = true; go.disabled = true; if (hb) hb.hidden = true; msg.textContent = ""; onOk(); return; }
    fails++; inp.classList.add("is-bad"); shake(box);
    msg.textContent = fails >= 2 && shown < hints.length ? "Держи подсказку." : "Не то. Попробуй ещё раз.";
    if (fails >= 2) showHint();
  };
  go.onclick = run;
  if (hb) hb.onclick = showHint;
  inp.onkeydown = e => { if (e.key === "Enter") run(); };
  inp.oninput = () => { inp.classList.remove("is-bad"); msg.textContent = ""; };
  return box;
}
function appear(...nodes) { if (G && !REDUCED) G.from(nodes, { y: 20, opacity: 0, duration: 0.9, ease: "expo.out", stagger: 0.08 }); }
function finishBtn(stage, done, text = "Принять сигнал") {
  const b = el(`<button class="btn" type="button">${esc(text)}</button>`);
  b.onclick = done; stage.appendChild(b); appear(b);
}
function nextStep(stage, label, fn) {
  const b = el(`<button class="btn" type="button">${esc(label)} →</button>`);
  b.onclick = () => {
    stage.innerHTML = ""; fn();
    $("#pScroll").scrollTo({ top: Math.max(0, stage.offsetTop - 90), behavior: REDUCED ? "auto" : "smooth" });
    if (G && !REDUCED) G.from(stage.children, { y: 24, opacity: 0, duration: 0.9, ease: "expo.out", stagger: 0.06 });
  };
  stage.appendChild(b); appear(b);
}
const loadImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });

/* ---------- 1. Плутон: фонарик в темноте ---------- */
function gPluto(p, stage, done) {
  stage.innerHTML = `
    <p class="mono step">Этап 01 / 01</p>
    <p class="task">Солнце отсюда — просто яркая звезда, света почти нет. Води пальцем по Плутону, это фонарик. Где-то на поверхности светятся четыре надписи.</p>
    <canvas class="torch" id="torch" aria-label="Карта Плутона в темноте"></canvas>
    <p class="note" id="torchNote">Найдено 0 из 4</p>`;
  const cv = $("#torch", stage), cx = cv.getContext("2d"), note = $("#torchNote", stage);
  // кусок карты New Horizons с сердцем-равниной Томбо в центре
  const SX = 256, SY = 26, SW = 512, SH = 322;
  const marks = [
    { t: "Даже", x: 0.16, y: 0.24 }, { t: "на самом", x: 0.8, y: 0.2 },
    { t: "холодном краю", x: 0.26, y: 0.84 }, { t: "есть сердце", x: 0.5, y: 0.6, heart: true }
  ];
  let img = null, W = 0, H = 0, px = -999, py = -999, found = 0, over = false;
  const R = () => Math.min(W, H) * 0.24;
  const heart = (x, y, s) => { cx.beginPath(); cx.moveTo(x, y + s * 0.35); cx.bezierCurveTo(x - s, y - s * 0.4, x - s * 0.45, y - s, x, y - s * 0.45); cx.bezierCurveTo(x + s * 0.45, y - s, x + s, y - s * 0.4, x, y + s * 0.35); cx.fill(); };
  const label = m => {
    const x = m.x * W, y = m.y * H, fs = Math.max(13, W * 0.036);
    cx.save(); cx.shadowColor = "rgba(255,181,71,0.9)"; cx.shadowBlur = 14; cx.fillStyle = "#ffd58a";
    cx.font = `400 ${fs}px Unbounded, sans-serif`; cx.textAlign = "center"; cx.textBaseline = "middle";
    if (m.heart) heart(x, y - fs * 1.1, fs * 0.9);
    cx.fillText(m.t, x, y); cx.restore();
  };
  function draw() {
    if (!img || !W) return;
    cx.fillStyle = "#000"; cx.fillRect(0, 0, W, H);
    cx.globalAlpha = 0.07; cx.drawImage(img, SX, SY, SW, SH, 0, 0, W, H); cx.globalAlpha = 1;
    marks.forEach(m => m.f && label(m));
    if (px > -900 && !over) {
      const r = R();
      cx.save(); cx.beginPath(); cx.arc(px, py, r, 0, 6.283); cx.clip();
      cx.drawImage(img, SX, SY, SW, SH, 0, 0, W, H); marks.forEach(label);
      const g = cx.createRadialGradient(px, py, r * 0.45, px, py, r);
      g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.92)");
      cx.fillStyle = g; cx.fillRect(px - r, py - r, r * 2, r * 2); cx.restore();
    }
    if (over) { cx.globalAlpha = 0.55; cx.drawImage(img, SX, SY, SW, SH, 0, 0, W, H); cx.globalAlpha = 1; marks.forEach(label); }
  }
  const size = () => {
    const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
    W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); draw();
  };
  const move = e => {
    const b = cv.getBoundingClientRect(); px = e.clientX - b.left; py = e.clientY - b.top;
    if (!over) marks.forEach(m => {
      if (m.f || Math.hypot(m.x * W - px, m.y * H - py) > R() * 0.55) return;
      m.f = true; found++; note.textContent = `Найдено ${found} из 4`;
      if (found === 4) later(finish, 600);
    });
    draw();
  };
  cv.addEventListener("pointermove", move);
  cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); move(e); });
  cv.addEventListener("pointerleave", () => { if (!over) { px = -999; draw(); } });
  addEventListener("resize", size);
  loadImg(TEX("pluto-map.jpg")).then(i => { img = i; size(); });
  function finish() {
    over = true; draw();
    const f = el(`<p class="fact">Даже на самом холодном краю есть сердце. <b>Это сердце светится для тебя.</b> Равнина Томбо почти идеальной формы, её сфотографировал аппарат New Horizons в 2015 году.</p>`);
    stage.appendChild(f); appear(f);
    finishBtn(stage, done);
  }
}

      <g class="outer">${[...AB].map((ch, k) => { const a = k / 32 * 2 * Math.PI; return `<text x="${(160 + 137 * Math.sin(a)).toFixed(1)}" y="${(160 - 137 * Math.cos(a)).toFixed(1)}">${ch}</text>`; }).join("")}</g>

      <text x="160" y="160" fill="#8a90a6" style="font-size:11px">тяни кольцо</text>

    <p class="note" id="pair">Сейчас под А стоит А</p>`;
  const disk = $(".disk", stage), inner = $(".inner", stage), pair = $("#pair", stage);

/* ---------- 6. Марс: морзянка марсохода ---------- */
const MORSE = { А: ".-", Б: "-...", В: ".--", Г: "--.", Д: "-..", Е: ".", Ж: "...-", З: "--..", И: "..", Й: ".---", К: "-.-", Л: ".-..", М: "--", Н: "-.", О: "---", П: ".--.", Р: ".-.", С: "...", Т: "-", У: "..-", Ф: "..-.", Х: "....", Ц: "-.-.", Ч: "---.", Ш: "----", Щ: "--.-", Ъ: "--.--", Ы: "-.--", Ь: "-..-", Э: "..-..", Ю: "..--", Я: ".-.-" };
let AC = null;
function beep(on) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (on) { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 640; g.gain.value = 0.12; o.connect(g).connect(AC.destination); o.start(); beep.o = o; }
    else if (beep.o) { beep.o.stop(); beep.o = null; }
  } catch (e) {}
}
function gMars(p, stage, done) {

    <div class="beacon"><span class="lamp" id="lamp" aria-hidden="true"></span><div class="row"><button class="btn" type="button" id="play">Принять сигнал</button><button class="btn btn--glass" type="button" id="slow" aria-pressed="false">Медленнее</button></div></div>
    <p class="tape" id="tape" aria-live="polite"></p>
    <div class="morse">${Object.entries(MORSE).map(([k, v]) => `<span><b>${k}</b>${v.replace(/\./g, "·").replace(/-/g, "–")}</span>`).join("")}</div>`;
  const lamp = $("#lamp", stage), tape = $("#tape", stage);

  $("#play", stage).onclick = async e => {

/* ---------- 8. Венера: кратер с её именем ---------- */
function gVenus(p, stage, done) {
  const T = { lat: -49.0, lon: 275.8 };
  stage.innerHTML = `
    <p class="mono step">Этап 01 / 01</p>
    <p class="task">Это настоящая радарная карта Венеры, её снял аппарат «Магеллан» сквозь облака. Широта идёт снизу вверх от 90° ю. ш. до 90° с. ш., долгота слева направо от 0° до 360° в. д. Найди кратер с координатами <b>49° ю. ш., 276° в. д.</b> и нажми на него.</p>
    <div class="vmap"><canvas id="vmap" aria-label="Карта Венеры"></canvas></div>
    <p class="vread" id="vread" aria-live="polite">Наведи на карту</p>`;
  const cv = $("#vmap", stage), cx = cv.getContext("2d"), read = $("#vread", stage);
  let img = null, W = 0, H = 0, hit = null, cur = null;
  const fmt = (lat, lon) => `${Math.abs(lat).toFixed(1)}° ${lat < 0 ? "ю. ш." : "с. ш."} · ${lon.toFixed(1)}° в. д.`;
  function draw() {
    if (!img || !W) return;
    // у снимка края на 240° в. д.: перекладываем так, чтобы карта шла от 0° до 360°
    const iw = img.width, ih = img.height;
    cx.drawImage(img, iw / 3, 0, iw * 2 / 3, ih, 0, 0, W * 2 / 3, H);
    cx.drawImage(img, 0, 0, iw / 3, ih, W * 2 / 3, 0, W / 3, H);
    cx.strokeStyle = "rgba(255,255,255,0.18)"; cx.lineWidth = 1; cx.fillStyle = "rgba(255,255,255,0.6)";
    cx.font = "500 10px JetBrains Mono, monospace";
    for (let lon = 0; lon <= 360; lon += 30) { const x = lon / 360 * W; cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, H); cx.stroke(); if (lon < 360) cx.fillText(lon + "°", x + 3, H - 4); }
    for (let lat = -60; lat <= 60; lat += 30) { const y = (90 - lat) / 180 * H; cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke(); cx.fillText((lat < 0 ? -lat + "° ю" : lat > 0 ? lat + "° с" : "0°"), 3, y - 3); }
    if (cur && !hit) { cx.strokeStyle = "#ffb547"; cx.beginPath(); cx.arc(cur.x, cur.y, 10, 0, 6.283); cx.moveTo(cur.x - 16, cur.y); cx.lineTo(cur.x + 16, cur.y); cx.moveTo(cur.x, cur.y - 16); cx.lineTo(cur.x, cur.y + 16); cx.stroke(); }
    if (hit) {
      const x = T.lon / 360 * W, y = (90 - T.lat) / 180 * H;
      cx.save(); cx.shadowColor = "#ffb547"; cx.shadowBlur = 16; cx.strokeStyle = "#ffb547"; cx.lineWidth = 2;
      cx.beginPath(); cx.arc(x, y, 9 + hit.r, 0, 6.283); cx.stroke();
      cx.fillStyle = "#ffd58a"; cx.font = "400 15px Unbounded, sans-serif"; cx.textAlign = "right"; cx.fillText("Nastya", x - 16, y - 12); cx.restore();
    }
  }
  const size = () => { const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); draw(); };
  const at = e => { const b = cv.getBoundingClientRect(); const x = e.clientX - b.left, y = e.clientY - b.top; return { x, y, lat: 90 - y / H * 180, lon: x / W * 360 }; };
  cv.addEventListener("pointermove", e => { if (hit) return; cur = at(e); read.textContent = fmt(cur.lat, cur.lon); draw(); });
  cv.addEventListener("pointerdown", e => {
    if (hit) return;
    cur = at(e); read.textContent = fmt(cur.lat, cur.lon); draw();
    const dLat = T.lat - cur.lat, dLon = T.lon - cur.lon;
    if (Math.hypot(dLat, dLon * Math.cos(T.lat * Math.PI / 180)) < 4.5) return found();
    const hints = [];
    if (Math.abs(dLat) > 3) hints.push(dLat < 0 ? "южнее" : "севернее");
    if (Math.abs(dLon) > 4) hints.push(dLon > 0 ? "восточнее (правее)" : "западнее (левее)");
    read.textContent = `${fmt(cur.lat, cur.lon)} — кратер ${hints.join(" и ")}`;
  });
  addEventListener("resize", size);
  loadImg(TEX("venus-radar.jpg")).then(i => { img = i; size(); });
  function found() {
    hit = { r: 0 }; draw();
    if (G && !REDUCED) G.to(hit, { r: 18, duration: 1.4, ease: "expo.out", onUpdate: draw }); else { hit.r = 18; draw(); }
    read.textContent = "49,0° ю. ш. · 275,8° в. д. · кратер Nastya";
    const f = el(`<p class="fact">Кратер <b>Nastya</b>, 12,5 километра в поперечнике. Международный астрономический союз назвал его так в 1997 году, от русского имени Анастасия. Получается, у тебя уже есть место на Венере.</p>`);
    stage.appendChild(f); appear(f); finishBtn(stage, done);
  }
}

function focusView(i) {

  const tags = document.querySelectorAll(".tag");
  if (!tags.length) return;
  const W = innerWidth, H = innerHeight, f = H / 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  tags.forEach(t => {
    const i = +t.dataset.i, w = worldOf(i);
    v3.copy(w).project(camera);
    if (v3.z > 1) { t.style.visibility = "hidden"; return; }
    t.style.visibility = "";
    const rp = radiusOf(i) / camera.position.distanceTo(w) * f;
    const cx = (v3.x * 0.5 + 0.5) * W, cy = (-v3.y * 0.5 + 0.5) * H;
    if (i === 6) { t.style.transform = `translate(${(cx - t.offsetWidth / 2).toFixed(1)}px, ${(cy + rp * 1.05 + 8).toFixed(1)}px)`; return; }
    const x = Math.min(cx + rp * 0.72, W - t.offsetWidth - 6);
    t.style.transform = `translate(${x.toFixed(1)}px, ${(cy - rp * 0.72 - 26).toFixed(1)}px)`;
  });
}

/* ---------- ввод: наведение, нажатие, вращение пальцем ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
const pickAt = (x, y) => {
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(hits, false)[0];
  return h ? h.object.userData.i : -1;
};
canvas.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY, th: rig.theta, moved: false, t: performance.now() }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", e => {
  if (e.pointerType === "mouse") { rig.px = e.clientX / innerWidth - 0.5; rig.py = e.clientY / innerHeight - 0.5; }
  if (down) {
    const dx = e.clientX - down.x;
    if (Math.abs(dx) > 6 || Math.abs(e.clientY - down.y) > 6) down.moved = true;
    if (down.moved && cam.mode === "rig") { rig.thetaV = 0; rig.theta = down.th + dx * 0.006; canvas.classList.add("is-grab"); }
    return;
  }
  if (cam.mode !== "rig" || e.pointerType !== "mouse") return;
  const i = pickAt(e.clientX, e.clientY);
  if (i !== hover) APP.hover(i);
});
canvas.addEventListener("pointerup", e => {
  canvas.classList.remove("is-grab");
  if (!down) return;
  const d = down; down = null;
  if (d.moved) { rig.thetaV = (rig.theta - d.th) / Math.max(1, performance.now() - d.t) * 400; return; }
  if (cam.mode !== "rig") return;
  const i = pickAt(e.clientX, e.clientY);
  if (i >= 0) { APP.hover(-1); APP.pick(i); }
});
canvas.addEventListener("pointercancel", () => { down = null; canvas.classList.remove("is-grab"); });

addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.fov = MOBILE() ? 58 : 42; camera.updateProjectionMatrix();
  rig.dist = homeDist();
});

/* ---------- кадр ---------- */
const clock = new THREE.Clock();
let smx = 0, smy = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  simT += dt * ts.v;
  sun.rotation.y += dt * 0.03;
  sun.material.uniforms.t.value = t;
  skyMat.uniforms.t.value = t; starMat.uniforms.t.value = t;
  const pulse = 1 + Math.sin(t * 1.3) * 0.025;
  glowA.scale.set(SUN_R * 7.5 * pulse, SUN_R * 7.5 * pulse, 1);
  belt.rotation.y += dt * 0.012 * ts.v;
  planets.forEach(p => {
    const i = p.id;
    p.angle = p.a0 + simT * p.sp;
    orbitPos(p, p.angle, p.holder.position);
    const spin = arcMode && i === 1 ? 0 : 1; // в финале Земля замирает, чтобы дуга стояла на месте
    p.mesh.rotation.y += dt * p.rot * (focusI === i ? 0.4 : 1) * spin;
    if (p.clouds) p.clouds.rotation.y += dt * p.rot * 1.15 * spin;
    p.sats.forEach(s => { s.a += dt * s.sp * Math.max(ts.v, 0.25); s.m.position.set(Math.cos(s.a) * s.dist, Math.sin(s.a * 0.7) * 0.2, Math.sin(s.a) * s.dist); });
    const target = (1 + p.glow * 0.25 + (hover === i ? 0.1 : 0)) * Math.max(p.vis ?? 1, 0.001);
    p.holder.scale.lerp(one.set(target, target, target), 0.12);
    // при приближении к планете орбиты гаснут, чтобы не резать кадр
    const o = p.orbit.material, want = focusI >= 0 ? 0 : hover === i ? Math.max(o.opacity, 0.6) : p.orbit.userData.base + (p.next ? Math.sin(t * 2.4) * 0.15 : 0);
    o.opacity += (want - o.opacity) * 0.08;
  });
  sun.scale.setScalar(1 + (hover === 6 ? 0.04 : 0));

  if (cam.mode === "rig") {
    smx += (rig.px - smx) * 0.05; smy += (rig.py - smy) * 0.05;
    if (!down) { rig.theta += (0.025 + rig.thetaV) * dt; rig.thetaV *= 0.95; }
    const save = [rig.px, rig.py]; rig.px = smx; rig.py = smy;
    rigPos(v3); rig.px = save[0]; rig.py = save[1];
    camera.position.lerp(v3, 0.1); look.lerp(ORIGIN, 0.1);
  } else if (cam.mode === "fly") {
    const k = cam.t, arc = Math.sin(k * Math.PI) * cam.from.distanceTo(cam.to) * 0.12;
    camera.position.lerpVectors(cam.from, cam.to, k); camera.position.y += arc;
    look.lerpVectors(cam.lookFrom, cam.lookTo, k);
  } else if (cam.mode === "hold" && focusI >= 0) {
    // планета ещё немного дрейфует, камера мягко следует за ней
    const v = arcMode ? arcView() : focusView(focusI);
    camera.position.lerp(v.pos, 0.05); look.lerp(v.lookAt, 0.05);
  }
  if (MOBILE() && cam.mode === "rig") wantUp.set(-Math.sin(rig.theta), 0, Math.cos(rig.theta)); else wantUp.copy(UP);
  camUp.lerp(wantUp, cam.mode === "fly" ? 0.06 : 0.1).normalize();
  camera.up.copy(camUp);
  camera.lookAt(look);
  renderer.render(scene, camera);
  placeLabels();
  requestAnimationFrame(frame);
}

manager.onLoad = () => {
  rigPos(camera.position); camera.lookAt(ORIGIN);
  requestAnimationFrame(frame);
  APP.ready(api);
};
manager.onError = url => console.warn("Не загрузилась текстура", url);
</script>
</body>
</html>
